<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🌿 GARDEN LEGACY</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
        :root{--bg:#fdf6f0;--bg2:#f0e8f5;--card:rgba(255,248,250,.9);--text:#4a3a5a;--text2:#6b5a7a;--border:rgba(200,180,220,.2);--shadow:rgba(160,130,180,.15);--bed:rgba(235,220,210,.4);--slot:rgba(255,240,230,.5);--slot-border:rgba(180,150,130,.3);--inv:rgba(255,248,240,.6);--btn:rgba(200,180,220,.2);--btn-text:#4a3a5a;--highlight:rgba(255,215,0,.15);--gold:#f5a623;--green:#7ed321;--red:#d34a4a;--tab-bg:rgba(200,180,220,.15);--tab-active:rgba(200,180,220,.35);--prestige-color:linear-gradient(135deg,#f5a623,#e8b4d8)}
        .dark{--bg:#1a1520;--bg2:#251f30;--card:rgba(40,35,50,.9);--text:#d4c8e0;--text2:#a898b0;--border:rgba(100,80,120,.3);--shadow:rgba(0,0,0,.4);--bed:rgba(50,40,60,.5);--slot:rgba(60,50,70,.5);--slot-border:rgba(100,80,120,.4);--inv:rgba(50,40,60,.6);--btn:rgba(100,80,120,.3);--btn-text:#c8b8d4;--highlight:rgba(255,215,0,.1);--tab-bg:rgba(100,80,120,.2);--tab-active:rgba(100,80,120,.4);--prestige-color:linear-gradient(135deg,#7b5ea7,#b28cd4)}
        body{font-family:'Segoe UI',system-ui,sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;padding:8px;transition:background .4s;display:flex;justify-content:center;align-items:center}
        .app{max-width:420px;width:100%;margin:0 auto;background:var(--card);backdrop-filter:blur(12px);border-radius:32px;padding:14px 12px 16px;box-shadow:0 20px 60px var(--shadow);border:1px solid var(--border);transition:background .4s;display:flex;flex-direction:column;height:100vh;max-height:780px}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;padding-bottom:8px;border-bottom:2px solid var(--border);flex-shrink:0}
        .shop-name{font-size:17px;font-weight:800;color:var(--text);background:var(--prestige-color);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
        .shop-name span{font-weight:400;font-size:12px;opacity:.6;-webkit-text-fill-color:var(--text2)}
        .header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
        .coins{background:rgba(255,215,0,.15);padding:2px 10px;border-radius:30px;font-weight:600;color:#8a7a3a;font-size:13px;border:1px solid rgba(255,215,0,.2)}
        .time-badge{font-size:11px;color:var(--text2);background:rgba(200,180,220,.15);padding:2px 8px;border-radius:30px}
        .prestige-badge{font-size:10px;background:var(--prestige-color);color:#fff;padding:1px 8px;border-radius:30px;font-weight:700}
        .main-content{flex:1;overflow-y:auto;padding:4px 0;margin-bottom:4px;scroll-behavior:smooth}
        .main-content::-webkit-scrollbar{width:3px}
        .main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}

        /* ГРЯДКИ ВЕРТИКАЛЬНЫЕ */
        .garden-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
        .bed,.pot{background:var(--bed);border-radius:12px;padding:6px 8px;border:2px solid var(--border);transition:background .4s;position:relative}
        .pot{border-color:var(--gold);background:rgba(245,166,35,.08)}
        .pot .pot-icon{position:absolute;top:-4px;right:-4px;font-size:16px}
        .bed .bee-icon{position:absolute;top:-4px;right:-4px;font-size:16px;animation:fly 2s ease-in-out infinite}
        @keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
        .bed-title{font-size:10px;font-weight:600;color:var(--text);margin-bottom:3px;display:flex;justify-content:space-between}
        .bed-slots{display:grid;gap:3px}
        .bed-slots.slots-4{grid-template-columns:repeat(4,1fr)}
        .bed-slots.slots-5{grid-template-columns:repeat(5,1fr)}
        .bed-slots.slots-6{grid-template-columns:repeat(6,1fr)}
        .pot .bed-slots{grid-template-columns:1fr}
        .slot{aspect-ratio:1/1;border-radius:8px;background:var(--slot);border:2px dashed var(--slot-border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s;position:relative}
        .slot:active{transform:scale(.92)}
        .slot.has-flower{background:rgba(150,200,100,.15);border:2px solid rgba(150,200,100,.3);cursor:default}
        .slot.growing{border-color:rgba(100,150,255,.4);background:rgba(100,150,255,.1)}
        .slot.growing-fast{border-color:var(--gold);background:rgba(245,166,35,.1);animation:fastGlow .8s ease infinite alternate}
        .slot.growing-pot{border-color:#7b5ea7;background:rgba(123,94,167,.1);animation:potGlow 1s ease infinite alternate}
        @keyframes fastGlow{0%{box-shadow:0 0 5px rgba(245,166,35,.2)}100%{box-shadow:0 0 15px rgba(245,166,35,.5)}}
        @keyframes potGlow{0%{box-shadow:0 0 5px rgba(123,94,167,.2)}100%{box-shadow:0 0 15px rgba(123,94,167,.5)}}
        .slot.ready{border-color:rgba(255,200,50,.5);background:rgba(255,200,50,.15);animation:glow 1s ease infinite alternate;cursor:pointer}
        @keyframes glow{0%{box-shadow:0 0 5px rgba(255,200,50,.2)}100%{box-shadow:0 0 12px rgba(255,200,50,.4)}}
        .slot .progress{position:absolute;bottom:2px;left:3px;right:3px;height:3px;background:rgba(0,0,0,.05);border-radius:4px;overflow:hidden}
        .slot .progress-fill{height:100%;background:linear-gradient(90deg,#8ab4f8,#6a9ef0);border-radius:4px;transition:width 1s linear}
        .slot .progress-fill.fast{background:linear-gradient(90deg,#f5a623,#f7c948)}
        .slot .progress-fill.pot{background:linear-gradient(90deg,#7b5ea7,#b28cd4)}
        .slot .seed-icon{font-size:9px;opacity:.5}
        .garden-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
        .garden-actions .btn{font-size:10px;padding:4px 10px;flex:1;min-width:50px}

        .btn{padding:4px 10px;border:none;border-radius:30px;font-weight:600;font-size:10px;cursor:pointer;transition:.2s;background:var(--btn);color:var(--btn-text);text-align:center}
        .btn:active{transform:scale(.94)}
        .btn-primary{background:rgba(150,200,120,.25);color:#4a7a3a}
        .btn-primary:active{background:rgba(150,200,120,.45)}
        .btn-gold{background:rgba(255,215,0,.2);color:#8a7a3a}
        .btn-gold:active{background:rgba(255,215,0,.4)}
        .btn-red{background:rgba(255,100,100,.15);color:#8a4a4a}
        .btn-red:active{background:rgba(255,100,100,.3)}
        .btn-green{background:rgba(100,200,100,.2);color:#3a7a3a}
        .btn-green:active{background:rgba(100,200,100,.4)}
        .btn-blue{background:rgba(100,150,255,.2);color:#3a5a8a}
        .btn-blue:active{background:rgba(100,150,255,.4)}
        .btn-purple{background:rgba(180,130,200,.2);color:#5a4a6b}
        .btn-purple:active{background:rgba(180,130,200,.4)}
        .btn-gold-bg{background:rgba(245,166,35,.2);color:#8a6a20}
        .btn-gold-bg:active{background:rgba(245,166,35,.4)}
        .btn-prestige{background:var(--prestige-color);color:#fff}
        .btn-prestige:active{opacity:.7}
        .btn:disabled{opacity:.4;cursor:not-allowed}
        .btn-sm{font-size:9px;padding:2px 8px}

        .mail-card{background:var(--inv);border-radius:10px;padding:8px 10px;margin-bottom:4px;border:1px solid var(--border)}
        .mail-card.urgent{border-color:var(--red);background:rgba(212,74,74,.08)}
        .mail-card .client-name{font-weight:600;color:var(--gold);font-size:11px}
        .mail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;flex-wrap:wrap;gap:3px}
        .mail-title{font-weight:600;color:var(--text);font-size:12px}
        .mail-timer{font-size:11px;color:var(--text2)}
        .mail-desc{font-size:12px;color:var(--text);margin-bottom:4px}
        .mail-actions{display:flex;gap:4px;flex-wrap:wrap}
        .mail-actions .btn{flex:1;padding:4px 8px;font-size:11px;min-width:50px}
        .mail-status{font-size:11px;color:var(--text2);text-align:center;padding:3px}

        .workbench{background:rgba(240,230,220,.2);border-radius:12px;padding:8px;min-height:60px;border:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;margin-bottom:4px}
        .workbench .slot{width:36px;height:36px;font-size:18px;border-radius:8px;background:var(--slot);border:2px dashed var(--slot-border);display:flex;align-items:center;justify-content:center;cursor:pointer}
        .workbench .slot.has-flower{border:2px solid rgba(150,200,100,.4);background:rgba(150,200,100,.15)}
        .inventory{display:flex;flex-wrap:wrap;gap:3px;padding:3px 0}
        .inv-item{background:var(--inv);border-radius:8px;padding:2px 8px;font-size:11px;border:1px solid var(--border);display:flex;align-items:center;gap:3px;cursor:pointer;transition:.2s;color:var(--text)}
        .inv-item:active{transform:scale(.92)}
        .inv-item .count{font-weight:600;color:var(--text)}

        .shop-grid{display:grid;gap:4px}
        .shop-item{background:var(--inv);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
        .shop-item .info{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
        .shop-item .info .emoji{font-size:18px;flex-shrink:0}
        .shop-item .info .name{font-weight:500;color:var(--text);font-size:11px;word-break:break-word}
        .shop-item .info .price{font-size:9px;color:var(--text2)}
        .shop-item .btn{flex:0 0 auto;padding:3px 10px;font-size:10px}
        .level-info{background:rgba(200,180,220,.1);border-radius:8px;padding:4px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:3px;color:var(--text);font-size:11px}

        .achievement-card{background:var(--inv);border-radius:8px;padding:4px 10px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
        .achievement-card .info{display:flex;align-items:center;gap:6px}
        .achievement-card .info .ach-emoji{font-size:16px}
        .achievement-card .info .ach-name{font-weight:500;color:var(--text);font-size:11px}
        .achievement-card .info .ach-desc{font-size:9px;color:var(--text2)}
        .achievement-card .ach-status{font-size:11px;font-weight:600}
        .achievement-card .ach-status.done{color:var(--green)}
        .achievement-card .ach-status.progress{color:var(--gold)}

        .bottom-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding-top:6px;border-top:2px solid var(--border);flex-shrink:0}
        .tab{aspect-ratio:1/1;border:none;border-radius:10px;font-weight:600;font-size:9px;cursor:pointer;transition:.3s;background:var(--tab-bg);color:var(--btn-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px}
        .tab .tab-icon{font-size:16px}
        .tab .tab-label{font-size:7px;opacity:.7}
        .tab.active{background:var(--tab-active);box-shadow:0 2px 10px rgba(160,130,180,.1)}
        .tab:active{transform:scale(.92)}
        .tab-content{display:none}
        .tab-content.active{display:block}

        .hidden{display:none!important}
        .overlay-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000}
        .overlay-card{background:var(--card);border-radius:28px;padding:16px 16px;max-width:400px;width:95%;max-height:95vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.2);border:1px solid var(--border)}
        .overlay-card .close-btn{background:0 0;border:none;font-size:22px;cursor:pointer;color:var(--text2);padding:0 4px;float:right}
        .overlay-card h3{color:var(--text);margin-bottom:6px;font-size:16px}
        .overlay-card .tutorial-step{background:var(--highlight);border-radius:10px;padding:8px 10px;margin:4px 0;border-left:4px solid #e8b4d8}
        .tutorial-step p{font-size:12px;color:var(--text2);line-height:1.4}

        .achievement-popup{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f5a623,#f7c948);color:#4a3a5a;padding:8px 16px;border-radius:14px;font-weight:700;font-size:13px;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:slideDown .5s cubic-bezier(.34,1.56,.64,1),fadeOut .5s 3s forwards;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.3)}
        .achievement-popup.dark{background:linear-gradient(135deg,#7b5ea7,#b28cd4);color:#fff}
        @keyframes slideDown{0%{transform:translateX(-50%) translateY(-80px);opacity:0}100%{transform:translateX(-50%) translateY(0);opacity:1}}
        @keyframes fadeOut{0%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}

        .quest-item,.leaderboard-item,.credit-item,.analytics-item{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--inv);border-radius:8px;margin-bottom:3px;border:1px solid var(--border);font-size:11px;color:var(--text)}
        .quest-item .info,.leaderboard-item .info{display:flex;align-items:center;gap:6px}
        .quest-item .q-emoji,.leaderboard-item .rank{font-size:14px}
        .volume-slider{width:100%;accent-color:#8a7a3a;background:var(--bg);border-radius:10px;height:4px}
        .settings-inline{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}
        .settings-inline .btn{flex:1;min-width:40px;font-size:9px;padding:3px 6px}
        .section-title{font-weight:600;color:var(--text);font-size:11px;margin:4px 0 3px}
        .stock-ticker{font-size:10px;color:var(--text2);padding:2px 0;display:flex;gap:6px;flex-wrap:wrap}
        .stock-ticker .up{color:var(--green)}
        .stock-ticker .down{color:var(--red)}

        .match3-board{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:300px;margin:6px auto;padding:4px;background:rgba(200,180,220,.1);border-radius:10px}
        .match3-cell{aspect-ratio:1/1;border-radius:6px;background:var(--slot);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);cursor:pointer;transition:.1s;color:var(--text)}
        .match3-cell.selected{border:3px solid #d8b4e6;transform:scale(.9);background:rgba(230,200,245,.3)}
        .match3-cell.pop-out{animation:popOut .25s ease forwards}
        @keyframes popOut{0%{transform:scale(1);opacity:1}100%{transform:scale(0) rotate(15deg);opacity:0}}
        .match3-cell.pop-in{animation:popIn .3s cubic-bezier(.34,1.56,.64,1) forwards}
        @keyframes popIn{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
        .match3-cell.falling{animation:fallDown .4s cubic-bezier(.34,1.2,.64,1) forwards}
        @keyframes fallDown{0%{transform:translateY(-50px) scale(.5);opacity:0}60%{transform:translateY(5px) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
        .match3-score{text-align:center;font-size:13px;font-weight:600;color:var(--text);padding:3px}
        .daily-bonus-btn{background:rgba(255,215,0,.15);color:#8a7a3a;border:1px solid rgba(255,215,0,.2);font-size:10px;padding:3px 10px}
        .chest-btn{background:rgba(255,215,0,.2);color:#8a7a3a;border:1px solid rgba(255,215,0,.2);font-size:10px;padding:3px 10px;animation:pulseChest 2s ease infinite}
        @keyframes pulseChest{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
        .customization-preview{display:flex;gap:4px;flex-wrap:wrap;padding:4px 0}
        .customization-preview .color-option{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;transition:.2s}
        .customization-preview .color-option:active{transform:scale(.9)}
        .customization-preview .color-option.active{border-color:var(--gold);transform:scale(1.1)}
        .trade-code{background:var(--bg);padding:4px 8px;border-radius:6px;font-size:12px;font-weight:600;color:var(--text);text-align:center;border:1px dashed var(--border)}
        .notification-perm{font-size:11px;color:var(--text2);padding:4px 0}
        @media(max-width:480px){.app{padding:8px 6px 10px;border-radius:20px;max-height:100vh}.shop-name{font-size:15px}.slot{font-size:17px}.garden-grid{gap:4px}.bed,.pot{padding:4px 6px}.tab .tab-icon{font-size:14px}.tab .tab-label{font-size:6px}.main-content{padding:2px 0}}
    </style>
</head>
<body>
<div class="app" id="app">
    <div class="header">
        <div class="shop-name">🌿 GARDEN LEGACY <span id="levelDisplay">ур.1</span></div>
        <div class="header-right">
            <span id="prestigeBadge" class="prestige-badge hidden">🌟</span>
            <span class="time-badge" id="timeDisplay">🕐 14:32</span>
            <span class="coins">🪙 <span id="coinDisplay">0</span></span>
        </div>
    </div>

    <div class="main-content" id="mainContent">
        <div id="tab-garden" class="tab-content active"><div id="gardenContent"></div></div>
        <div id="tab-mail" class="tab-content"><div id="mailContent"></div></div>
        <div id="tab-workbench" class="tab-content"><div id="workbenchContent"></div></div>
        <div id="tab-shop" class="tab-content"><div id="shopContent"></div></div>
        <div id="tab-achievements" class="tab-content"><div id="achievementsContent"></div></div>
        <div id="tab-more" class="tab-content"><div id="moreContent"></div></div>
    </div>

    <div class="bottom-tabs">
        <button class="tab active" data-tab="garden"><span class="tab-icon">🌱</span><span class="tab-label">Сад</span></button>
        <button class="tab" data-tab="mail"><span class="tab-icon">📬</span><span class="tab-label">Почта</span></button>
        <button class="tab" data-tab="workbench"><span class="tab-icon">🔧</span><span class="tab-label">Верстак</span></button>
        <button class="tab" data-tab="shop"><span class="tab-icon">🏪</span><span class="tab-label">Магазин</span></button>
        <button class="tab" data-tab="achievements"><span class="tab-icon">🏆</span><span class="tab-label">Достиж.</span></button>
        <button class="tab" data-tab="more"><span class="tab-icon">⚙️</span><span class="tab-label">Ещё</span></button>
    </div>

    <div id="match3Overlay" class="hidden overlay-bg">
        <div class="overlay-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><h3>🎮 Три в ряд</h3><button id="closeMatch3Btn" class="close-btn">✕</button></div>
            <div id="match3Container"></div>
            <div style="text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);"><button id="closeMatch3BtnBottom" class="btn btn-red" style="padding:6px 16px;font-size:13px;width:100%;">🚪 Выйти</button></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// ДАННЫЕ (15 ЦВЕТОВ)
// ============================================================
const FLOWERS = {
    rose:{e:'🌹',n:'Роза',c:5,p:10},tulip:{e:'🌷',n:'Тюльпан',c:7,p:15},
    sunflower:{e:'🌻',n:'Подсолнух',c:12,p:25},chamomile:{e:'🌼',n:'Ромашка',c:19,p:30},
    lotus:{e:'🪷',n:'Лотос',c:25,p:40},hibiscus:{e:'🌺',n:'Гибискус',c:8,p:18},
    peony:{e:'🌷',n:'Пион',c:10,p:22},narcissus:{e:'🌼',n:'Нарцисс',c:14,p:28},
    orchid:{e:'🌸',n:'Орхидея',c:20,p:35},lavender:{e:'🌻',n:'Лаванда',c:9,p:20},
    hydrangea:{e:'🌹',n:'Гортензия',c:15,p:32},waterlily:{e:'🪷',n:'Кувшинка',c:22,p:45},
    crocus:{e:'🌷',n:'Крокус',c:6,p:14},aster:{e:'🌼',n:'Астра',c:11,p:24},
    daisy:{e:'🌻',n:'Маргаритка',c:4,p:12}
};
const FK=Object.keys(FLOWERS);
const GROW_TIME=60, ORDER_MIN=30, ORDER_MAX=120, ORDER_TIMEOUT=300;

// КЛИЕНТЫ С ИМЕНАМИ
const CLIENT_NAMES=['Анна','Максим','Елена','Дмитрий','Ольга','Сергей','Наталья','Алексей','Татьяна','Иван','Мария','Павел','Екатерина','Андрей','Юлия','Владимир','Ирина','Николай','Светлана','Михаил'];
const CLIENT_TYPES=['постоянный','новый','VIP','обычный'];
function getClientName(){return CLIENT_NAMES[Math.floor(Math.random()*CLIENT_NAMES.length)];}
function getClientType(){return CLIENT_TYPES[Math.floor(Math.random()*CLIENT_TYPES.length)];}

// ============================================================
// СОСТОЯНИЕ
// ============================================================
let G={
    coins:0,level:1,beds:[],pots:[],bedCap:4,
    seeds:{},flowers:{},mail:[],nextOrder:0,tutorialShown:false,
    fertilizers:0,bees:[],rating:0,ordersCompleted:0,
    flowersHarvested:0,seedsPlanted:0,achievements:{},

let achPopupTimer=null;
function showAchievementPopup(emoji,name){
    let old=document.querySelector('.achievement-popup');if(old)old.remove();
    let div=document.createElement('div');
    div.className='achievement-popup'+(darkTheme?' dark':'');
    div.innerHTML=`🏆 ${emoji} ${name}`;
    document.body.appendChild(div);
    if(achPopupTimer)clearTimeout(achPopupTimer);
    achPopupTimer=setTimeout(()=>{if(div.parentNode)div.remove();},3500);
    // Уведомление
    if(G.notificationsEnabled && 'Notification' in window && Notification.permission==='granted'){
        new Notification('GARDEN LEGACY',{body:`🏆 Достижение: ${emoji} ${name}`,icon:'🌿'});
    }
}

function checkAchievements(type,val){
    let updated=false;
    Object.keys(ACHIEVEMENTS).forEach(k=>{
        let a=ACHIEVEMENTS[k];
        if(a.type===type){
            if(G.achievements[k]<a.need){
                let newVal=Math.min(G.achievements[k]+val,a.need);
                if(newVal!==G.achievements[k]){
                    G.achievements[k]=newVal;updated=true;
                    if(newVal>=a.need){showAchievementPopup(a.e,a.n);S.play('win');}
                }
            }
        }
    });
    if(updated){save();renderAchievements();}
}

function updateStock(){

        save();

const S=new class{
    constructor(){this.ctx=null;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}
    play(t){
        if(!this.ctx||G.soundVolume<0.01)return;
        try{
            let o=this.ctx.createOscillator(),g=this.ctx.createGain();
            o.connect(g);g.connect(this.ctx.destination);g.gain.value=G.soundVolume*0.12;
            let s={plant:[400,600,.12],harvest:[600,900,.15],order:[500,800,.2],
                   complete:[400,600,.25],buy:[300,500,.3],error:[300,200,.2],
                   match3:[500,900,.18],win:[400,1000,.4]};
            if(!s[t])return;let a=s[t];
            o.frequency.setValueAtTime(a[0],this.ctx.currentTime);
            o.frequency.exponentialRampToValueAtTime(a[1],this.ctx.currentTime+.15);
            g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+a[2]);
            o.start(this.ctx.currentTime);o.stop(this.ctx.currentTime+a[2]);
        }catch(e){}
    }
};
function setVolume(v){G.soundVolume=Math.max(0,Math.min(1,v));save();}

function getGrowTime(bedIdx,slotIdx,isPot=false){
    let base=GROW_TIME;
    if(isPot)base*=0.9;
    if(G.events.active?.bonus==='grow')base*=0.5;
    let bed=G.beds[bedIdx];
    if(bed&&bed.slots[slotIdx]?.fertilized)base*=0.5;
    return base;
}
function getPotGrowTime(potIdx,slotIdx){let base=GROW_TIME*0.9;if(G.events.active?.bonus==='grow')base*=0.5;return base;}

function plantInBed(bi,si,k){
    let bed=G.beds[bi];if(!bed||bed.slots[si].flower){msg('Здесь уже что-то растёт');return false;}
    if((G.seeds[k]||0)<=0){msg(`Нет семян ${FLOWERS[k].e} ${FLOWERS[k].n}`);return false;}
    G.seeds[k]--;bed.slots[si]={flower:k,plantedAt:Date.now(),fertilized:false};
    G.seedsPlanted=(G.seedsPlanted||0)+1;checkAchievements('plant',1);updateQuests('plant',1);updateAnalytics('plants',1);
    save();render();S.play('plant');msg(`🌱 Посажен ${FLOWERS[k].n}`);return true;
}
function plantInPot(pi,si,k){
    let pot=G.pots[pi];if(!pot){msg('Горшка нет');return false;}
    if(pot.slots[si].flower){msg('Здесь уже что-то растёт');return false;}
    if((G.seeds[k]||0)<=0){msg(`Нет семян ${FLOWERS[k].e} ${FLOWERS[k].n}`);return false;}
    G.seeds[k]--;pot.slots[si]={flower:k,plantedAt:Date.now(),fertilized:false};
    G.seedsPlanted=(G.seedsPlanted||0)+1;checkAchievements('plant',1);updateQuests('plant',1);updateAnalytics('plants',1);
    save();render();S.play('plant');msg(`🏺 Посажен ${FLOWERS[k].n} в горшок (+10%)`);return true;
}

function harvestFromBed(bi,si){
    let bed=G.beds[bi];if(!bed)return;let slot=bed.slots[si];if(!slot||!slot.flower)return;
    let growTime=getGrowTime(bi,si,false);let elapsed=(Date.now()-slot.plantedAt)/1000;
    if(elapsed<growTime){let left=Math.ceil(growTime-elapsed);msg(`⏳ Осталось ${left} сек`);return;}
    let k=slot.flower;let bonus=1+G.prestigeBonus/100;

function generateOrder(){

    let clientName=getClientName(),clientType=getClientType();
    let o={flowers:[],createdAt:Date.now(),accepted:false,completed:false,expired:false,urgent:urgent,reward:0,client:clientName,clientType:clientType};
    for(let i=0;i<c;i++)o.flowers.push(FK[Math.floor(Math.random()*FK.length)]);
    let base=o.flowers.reduce((s,k)=>s+Math.floor(G.stockPrices[k]||FLOWERS[k].p),0);
    o.reward=urgent?base*3:base;
    o.timeoutAt=Date.now()+(urgent?60000:ORDER_TIMEOUT*1000);
    G.mail.push(o);save();S.play('order');render();
    sendNotification('📬 Новый заказ!',`${clientName} (${clientType}) заказал букет`);
    msg(`📬 ${urgent?'🚨 СРОЧНЫЙ x3! ':''}${clientName} (${clientType}) заказал ${c} цветов`);
}
function orderDesc(o){let c={};o.flowers.forEach(f=>c[f]=(c[f]||0)+1);return Object.keys(c).map(k=>`${c[k]} ${FLOWERS[k].e}${FLOWERS[k].n}`).join(', ');}
function acceptOrder(i){
    let o=G.mail[i];if(!o||o.accepted||o.completed||o.expired)return;
    o.accepted=true;save();render();S.play('order');
    // Бонус за лояльность
    if(o.clientType==='постоянный'){G.loyalty=(G.loyalty||0)+1;}
    msg(`✅ Заказ принят! ${o.urgent?'1 минута':'3 минуты'}`);
}
function declineOrder(i){let o=G.mail[i];if(!o||o.accepted)return;G.mail.splice(i,1);save();render();msg('❌ Отказано');}
function deliverBouquet(i){
    let o=G.mail[i];if(!o||!o.accepted||o.completed||o.expired){msg('Нельзя выполнить');return;}
    if(!workbench.length){msg('На верстаке нет цветов');return;}
    let bench={};workbench.forEach(k=>bench[k]=(bench[k]||0)+1);
    let need={};o.flowers.forEach(f=>need[f]=(need[f]||0)+1);
    for(let k of Object.keys(need)){if((bench[k]||0)<need[k]){msg(`Не хватает ${FLOWERS[k].e} ${FLOWERS[k].n}`);return;}}
    for(let k of Object.keys(need)){let c=need[k];for(let i=workbench.length-1;i>=0&&c>0;i--)if(workbench[i]===k){workbench.splice(i,1);c--;}}
    let reward=o.reward;if(G.events.active?.bonus==='orders')reward*=2;
    let bonus=1+G.prestigeBonus/100;
    reward=Math.floor(reward*bonus);
    // Бонус за лояльность
    if(o.clientType==='VIP')reward=Math.floor(reward*1.5);
    G.coins+=reward;G.ordersCompleted=(G.ordersCompleted||0)+1;
    G.rating=Math.min(10,Math.floor(G.ordersCompleted/5)+G.level);
    checkAchievements('order',1);checkAchievements('coins',reward);checkAchievements('rating',1);
    updateQuests('order',1);updateQuests('coins',reward);updateAnalytics('coins',reward);updateAnalytics('orders',1);
    updateTournament(reward);
    // Сундук каждые 10 заказов
    if(G.ordersCompleted%10===0){G.chests=(G.chests||0)+1;showAchievementPopup('🎁','Сундук получен!');}
    o.completed=true;save();render();S.play('complete');
    msg(`🎉 +${reward} 🪙${G.events.active?.bonus==='orders'?' x2!':''} | ⭐ ${G.rating}`);
    if(o.clientType==='постоянный')msg(`💛 ${o.client} постоянный клиент!`);
    setTimeout(()=>{let i2=G.mail.indexOf(o);if(i2!==-1){G.mail.splice(i2,1);save();render();}},2000);
}
function checkTimeout(){
    let now=Date.now(),ch=false;
    G.mail=G.mail.filter(o=>{
        if(!o.accepted&&!o.completed&&!o.expired&&now>o.timeoutAt){ch=true;return false;}
        if(o.accepted&&!o.completed&&!o.expired&&now>o.timeoutAt+(o.urgent?60000:180000)){o.expired=true;ch=true;}
        if(o.expired||o.completed){if(now-o.timeoutAt>5000||o.completed){ch=true;return false;}}
        return true;
    });
    if(ch){save();render();}
}

function getInflation(){return 1+Math.floor(G.level/5)*0.05;}

function buyUpgrade(type){

function buyPot(){

let m3Board=[],m3Sel=null,m3Score=0,m3Processing=false;
const M3E=[...new Set(FK.map(k=>FLOWERS[k].e))];

function initM3(){
    m3Board=[];for(let r=0;r<7;r++){m3Board[r]=[];for(let c=0;c<7;c++)m3Board[r][c]=M3E[Math.floor(Math.random()*M3E.length)];}
    let it=0;while(hasM3Match()&&it<50){it++;for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(isM3Match(r,c))m3Board[r][c]=M3E[Math.floor(Math.random()*M3E.length)];}
    m3Sel=null;m3Score=0;m3Processing=false;renderM3();
}
function hasM3Match(){for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(isM3Match(r,c))return true;return false;}
function isM3Match(r,c){let v=m3Board[r][c];if(!v)return false;if(c<=4&&m3Board[r][c+1]===v&&m3Board[r][c+2]===v)return true;if(r<=4&&m3Board[r+1][c]===v&&m3Board[r+2][c]===v)return true;return false;}
function getAllM3(){let s=new Set();for(let r=0;r<7;r++)for(let c=0;c<7;c++){let v=m3Board[r][c];if(!v)continue;if(c<=4&&m3Board[r][c+1]===v&&m3Board[r][c+2]===v){let e=c+2;while(e+1<7&&m3Board[r][e+1]===v)e++;for(let i=c;i<=e;i++)s.add(r+','+i);}if(r<=4&&m3Board[r+1][c]===v&&m3Board[r+2][c]===v){let e=r+2;while(e+1<7&&m3Board[e+1][c]===v)e++;for(let i=r;i<=e;i++)s.add(i+','+c);}}return s;}
function calcM3(s){let r=new Map,cl=new Map;for(let k of s){let [rr,cc]=k.split(',').map(Number);r.has(rr)||r.set(rr,[]);r.get(rr).push(cc);cl.has(cc)||cl.set(cc,[]);cl.get(cc).push(rr);}let t=0;for(let [_,p] of r){p.sort((a,b)=>a-b);let st=1;for(let i=1;i<p.length;i++){if(p[i]===p[i-1]+1)st++;else{t+=st>=3?st*2:0;st=1;}}t+=st>=3?st*2:0;}for(let [_,p] of cl){p.sort((a,b)=>a-b);let st=1;for(let i=1;i<p.length;i++){if(p[i]===p[i-1]+1)st++;else{t+=st>=3?st*2:0;st=1;}}t+=st>=3?st*2:0;}return t;}
async function processM3(){
    if(m3Processing)return;m3Processing=true;let any=false,it=0;
    while(it<20){it++;let matches=getAllM3();if(!matches.size)break;any=true;let pts=calcM3(matches);m3Score+=pts;document.getElementById('m3Score').textContent='⭐ '+m3Score;S.play('match3');let cells=document.querySelectorAll('.match3-cell');for(let k of matches){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(cells[idx])cells[idx].classList.add('pop-out');}await new Promise(r=>setTimeout(r,300));for(let k of matches){let [r,c]=k.split(',').map(Number);m3Board[r][c]=null;}let fall=[];for(let c=0;c<7;c++){let vals=[];for(let r=6;r>=0;r--)if(m3Board[r][c]!==null)vals.push(m3Board[r][c]);let idx=0;for(let r=6;r>=0;r--){if(idx<vals.length){m3Board[r][c]=vals[idx];idx++;}else{m3Board[r][c]=M3E[Math.floor(Math.random()*M3E.length)];fall.push(r+','+c);}}}renderM3();let c2=document.querySelectorAll('.match3-cell');for(let k of fall){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(c2[idx]){c2[idx].classList.remove('pop-in');c2[idx].classList.add('falling');}}await new Promise(r=>setTimeout(r,400));for(let k of fall){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(c2[idx])c2[idx].classList.remove('falling');}}
    m3Processing=false;
    if(any){const seedCount=Math.random()>0.5?2:1;let rewardText='';for(let i=0;i<seedCount;i++){const seedKey=FK[Math.floor(Math.random()*FK.length)];G.seeds[seedKey]=(G.seeds[seedKey]||0)+1;rewardText+=FLOWERS[seedKey].e;}save();updateUI();document.getElementById('m3Reward').textContent='🌱 +'+rewardText;S.play('win');}
    renderM3();
}
function onM3Click(r,c){if(m3Processing)return;if(!m3Sel){m3Sel={r,c};renderM3();return;}if(m3Sel.r===r&&m3Sel.c===c){m3Sel=null;renderM3();return;}let dr=Math.abs(m3Sel.r-r),dc=Math.abs(m3Sel.c-c);if((dr===1&&dc===0)||(dr===0&&dc===1)){let t=m3Board[m3Sel.r][m3Sel.c];m3Board[m3Sel.r][m3Sel.c]=m3Board[r][c];m3Board[r][c]=t;let sr=m3Sel.r,sc=m3Sel.c;m3Sel=null;renderM3();if(hasM3Match())processM3();else{let t2=m3Board[sr][sc];m3Board[sr][sc]=m3Board[r][c];m3Board[r][c]=t2;renderM3();msg('😌 Попробуйте другую');}}else{m3Sel={r,c};renderM3();}}
function renderM3(){let el=document.getElementById('match3Container');let h=`<div class="match3-score" id="m3Score">⭐ ${m3Score}</div><div class="match3-score" id="m3Reward" style="font-size:11px;color:var(--text2);">🌱 1-2 семечка за игру</div><div class="match3-board">`;for(let r=0;r<7;r++)for(let c=0;c<7;c++){let v=m3Board[r][c]||'🌸',sel=m3Sel&&m3Sel.r===r&&m3Sel.c===c;h+=`<div class="match3-cell ${sel?'selected':''}" onclick="onM3Click(${r},${c})" style="font-size:${window.innerWidth<480?'16px':'20px'}">${v}</div>`;}h+=`</div><div style="text-align:center;margin-top:4px;"><button class="btn btn-primary" onclick="initM3()" style="padding:4px 14px;font-size:11px;">🔄 Новая</button></div>`;el.innerHTML=h;}
function openM3(){document.getElementById('match3Overlay').classList.remove('hidden');document.body.style.overflow='hidden';initM3();}
function closeM3(){document.getElementById('match3Overlay').classList.add('hidden');document.body.style.overflow='';}

function getLeaderboard(){
    let players=[];try{let d=JSON.parse(localStorage.getItem('flowerShopLB')||'[]');players=d;}catch(e){}
    players.push({name:'🌿 Вы',score:G.coins+G.bank+G.prestige*1000,level:G.level,orders:G.ordersCompleted});
    players.sort((a,b)=>b.score-a.score);players=players.slice(0,10);
    localStorage.setItem('flowerShopLB',JSON.stringify(players));return players;
}

function renderGarden(){
    let el=document.getElementById('gardenContent');
    let h='<div class="garden-grid">';
    G.beds.forEach((bed,bi)=>{
        let cap=bed.slots.length,cls=cap<=4?'slots-4':cap===5?'slots-5':'slots-6';
        let beeIcon=bed.hasBee?'<div class="bee-icon">🐝</div>':'';
        h+=`<div class="bed">${beeIcon}<div class="bed-title"><span>🌱 Грядка ${bi+1}</span><span>${cap} мест</span></div><div class="bed-slots ${cls}">`;
        bed.slots.forEach((slot,si)=>{
            let p=getProgressBed(bi,si);
            if(slot.flower){
                let isFast=slot.fertilized;
                if(p===null)h+=`<div class="slot has-flower">${FLOWERS[slot.flower].e}</div>`;
                else if(p>=1)h+=`<div class="slot ready" onclick="harvestFromBed(${bi},${si})">${FLOWERS[slot.flower].e}</div>`;
                else{let cls2=isFast?'growing-fast':'growing';let pCls=isFast?'fast':'';h+=`<div class="slot ${cls2}" onclick="applyFertilizerToBed(${bi},${si})">${FLOWERS[slot.flower].e}<div class="progress"><div class="progress-fill ${pCls}" style="width:${Math.round(p*100)}%"></div></div></div>`;}
            }else{let has=FK.some(k=>(G.seeds[k]||0)>0);h+=`<div class="slot" onclick="showPlantMenuBed(${bi},${si})" style="cursor:pointer;${has?'':'opacity:.5;'}">${has?'🌱':'🌱<div class="seed-icon">нет</div>'}</div>`;}
        });
        h+=`</div></div>`;
    });
    G.pots.forEach((pot,pi)=>{
        let cap=pot.slots.length;
        h+=`<div class="pot"><div class="pot-icon">🏺</div><div class="bed-title"><span>🏺 Горшок ${pi+1}</span><span>${cap} мест</span></div><div class="bed-slots slots-${cap}">`;
        pot.slots.forEach((slot,si)=>{
            let p=getProgressPot(pi,si);
            if(slot.flower){
                if(p===null)h+=`<div class="slot has-flower">${FLOWERS[slot.flower].e}</div>`;
                else if(p>=1)h+=`<div class="slot ready" onclick="harvestFromPot(${pi},${si})">${FLOWERS[slot.flower].e}</div>`;
                else{let cls2='growing-pot';h+=`<div class="slot ${cls2}" onclick="applyFertilizerToPot(${pi},${si})">${FLOWERS[slot.flower].e}<div class="progress"><div class="progress-fill pot" style="width:${Math.round(p*100)}%"></div></div></div>`;}
            }else{let has=FK.some(k=>(G.seeds[k]||0)>0);h+=`<div class="slot" onclick="showPlantMenuPot(${pi},${si})" style="cursor:pointer;${has?'':'opacity:.5;'}">${has?'🌱':'🌱<div class="seed-icon">нет</div>'}</div>`;}
        });
        h+=`</div></div>`;
    });
    h+=`</div><div class="garden-actions"><button class="btn btn-primary" onclick="showPlantMenuGlobal()">🌱 Посадить</button><button class="btn btn-gold" onclick="harvestAll()">🧺 Собрать всё</button><button class="btn btn-blue" onclick="openM3()">🎮 Играть</button>`;
    if(G.fertilizers>0)h+=`<span style="font-size:10px;color:var(--text2);padding:3px 6px;">🧪 ${G.fertilizers}</span>`;
    if(G.events.active)h+=`<span style="font-size:10px;color:var(--gold);padding:3px 6px;">${G.events.active.e}</span>`;
    if(G.chests>0)h+=`<button class="btn chest-btn" onclick="openChest()" style="flex:0;padding:2px 10px;">🎁 ${G.chests}</button>`;
    h+=`</div>`;
    el.innerHTML=h;
}

function renderMail(){
    let el=document.getElementById('mailContent');
    checkTimeout();let active=G.mail.filter(o=>!o.completed);
    if(!active.length){el.innerHTML=`<div style="text-align:center;padding:16px 0;color:var(--text2);"><div style="font-size:32px;">📬</div><p style="font-size:12px;">Почта пуста</p><p style="font-size:10px;opacity:.6;">Новое письмо через 30 сек – 2 мин</p></div>`;return;}
    let h='';
    active.forEach((o,i)=>{
        let desc=orderDesc(o),acceptLeft=Math.max(0,Math.floor((o.timeoutAt-Date.now())/1000));
        let timeLeft=o.accepted?Math.max(0,Math.floor((o.timeoutAt+(o.urgent?60000:180000)-Date.now())/1000)):null;
        let status='',cls=o.urgent?'mail-card urgent':'mail-card';
        if(o.accepted&&!o.expired){let bench={};workbench.forEach(k=>bench[k]=(bench[k]||0)+1);let need={};o.flowers.forEach(f=>need[f]=(need[f]||0)+1);let can=true;for(let k of Object.keys(need)){if((bench[k]||0)<need[k]){can=false;break;}}status=`<div class="mail-actions"><button class="btn btn-green" onclick="deliverBouquet(${G.mail.indexOf(o)})" ${!can?'disabled':''}>💐 Отдать</button><span class="mail-timer">⏱️ ${timeLeft} сек</span></div>${!can?'<div style="font-size:10px;color:var(--text2);">Не хватает цветов</div>':''}`;}
        else if(o.expired){status=`<div class="mail-status">⏰ Время вышло!</div>`;}
        else if(!o.accepted){status=`<div class="mail-actions"><button class="btn btn-green" onclick="acceptOrder(${G.mail.indexOf(o)})">✅ Принять</button><button class="btn btn-red" onclick="declineOrder(${G.mail.indexOf(o)})">❌ Отказать</button><span class="mail-timer">⏱️ ${acceptLeft} сек</span></div>`;}
        let reward=o.reward;if(G.rating>0)reward=Math.floor(reward*(1+G.rating*0.05));
        let urgentTag=o.urgent?'🚨 СРОЧНЫЙ x3! ':'';
        let clientTag=o.clientType==='VIP'?'👑 ':'';
        h+=`<div class="${cls}"><div class="mail-header"><span class="mail-title">📩 ${urgentTag}${clientTag}${o.client}</span><span class="mail-timer">💰 ${reward} 🪙</span></div><div class="mail-desc">Букет из ${desc}</div>${status}</div>`;
    });
    el.innerHTML=h;
}

function updateUI(){
    document.getElementById('coinDisplay').textContent=G.coins;
    document.getElementById('levelDisplay').textContent='ур.'+G.level;
    document.getElementById('timeDisplay').textContent='🕐 '+timeStr();
    let badge=document.getElementById('prestigeBadge');
    if(G.prestige>0){badge.classList.remove('hidden');badge.textContent='🌟 x'+G.prestige;}else{badge.classList.add('hidden');}
    let btn=document.getElementById('dailyBonusBtn');
    if(btn){let now=Date.now(),last=G.dailyBonus.lastClaim||0;
        if(now-last<86400000){let left=Math.ceil((86400000-(now-last))/3600000);btn.textContent=`⏳ ${left}ч`;btn.disabled=true;}
        else{btn.textContent='🎁 +'+(100+G.prestigeBonus*5);btn.disabled=false;}}
}

function showPlantMenuBed(bi,si){plantPending={type:'bed',bedIdx:bi,slotIdx:si};showPlantMenuGeneric();}
function showPlantMenuPot(pi,si){plantPending={type:'pot',potIdx:pi,slotIdx:si};showPlantMenuGeneric();}
function showPlantMenuGeneric(){
    let has=FK.some(k=>(G.seeds[k]||0)>0);if(!has){msg('😔 Нет семян!');return;}
    let h=`<div class="overlay-bg" onclick="closePlantMenu(event)"><div class="overlay-card" onclick="event.stopPropagation();"><button class="close-btn" onclick="closePlantMenu()">✕</button><h3>🌱 Посадить</h3><div style="display:grid;grid-template-columns:1fr 1fr;gap:3px;">`;
    FK.forEach(k=>{let c=G.seeds[k]||0;h+=`<button class="btn ${c>0?'btn-primary':''}" onclick="plantFromMenu('${k}')" ${c<=0?'disabled':''}>${FLOWERS[k].e} ${FLOWERS[k].n}<br><span style="font-size:9px;opacity:.6;">${c} шт.</span></button>`;});
    h+=`</div><button class="btn btn-red" onclick="closePlantMenu()" style="margin-top:6px;width:100%;">Отмена</button></div></div>`;
    let old=document.querySelector('.plant-menu-overlay');if(old)old.remove();
    let div=document.createElement('div');div.className='plant-menu-overlay';div.innerHTML=h;document.body.appendChild(div);
}
function closePlantMenu(){let el=document.querySelector('.plant-menu-overlay');if(el)el.remove();plantPending=null;}
function plantFromMenu(k){if(!plantPending)return;if(plantPending.type==='bed')plantInBed(plantPending.bedIdx,plantPending.slotIdx,k);else if(plantPending.type==='pot')plantInPot(plantPending.potIdx,plantPending.slotIdx,k);closePlantMenu();}
function showPlantMenuGlobal(){
    for(let bi=0;bi<G.beds.length;bi++){let b=G.beds[bi];for(let si=0;si<b.slots.length;si++)if(!b.slots[si].flower){showPlantMenuBed(bi,si);return;}}
    for(let pi=0;pi<G.pots.length;pi++){let p=G.pots[pi];for(let si=0;si<p.slots.length;si++)if(!p.slots[si].flower){showPlantMenuPot(pi,si);return;}}
    msg('Все места заняты!');
}

function msg(t){let b=document.querySelector('.message-box');if(!b){let d=document.createElement('div');d.className='message-box';d.style.cssText='position:fixed;bottom:65px;left:50%;transform:translateX(-50%);background:rgba(40,30,50,.85);color:#fff;padding:6px 14px;border-radius:16px;font-size:12px;z-index:1000;backdrop-filter:blur(8px);text-align:center;max-width:90%;transition:opacity .3s;opacity:0;';document.body.appendChild(d);b=d;}b.textContent=t;b.style.opacity='1';if(msgTimer)clearTimeout(msgTimer);msgTimer=setTimeout(()=>{b.style.opacity='0';setTimeout(()=>{if(b.parentNode)b.remove();},400);},2500);}

// ============================================================
// ЦИКЛ
// ============================================================
function gameLoop(){
    updateUI();bankInterest();updateStock();checkTournament();
    let maxOrders=Math.min(3+G.rating,10);
    if(G.mail.filter(o=>!o.completed).length<maxOrders){
        if(!G.nextOrder||Date.now()>G.nextOrder){
            generateOrder();
            let interval=Math.max(20,ORDER_MIN-Math.min(G.rating*2,40));
            G.nextOrder=Date.now()+(interval+Math.random()*(ORDER_MAX-interval))*1000;
        }
    }
    // Уведомления о готовых цветах (каждые 30 сек)
    let ready=0;
    G.beds.forEach((bed,bi)=>{bed.slots.forEach((slot,si)=>{if(slot.flower&&getProgressBed(bi,si)>=1)ready++;});});
    G.pots.forEach((pot,pi)=>{pot.slots.forEach((slot,si)=>{if(slot.flower&&getProgressPot(pi,si)>=1)ready++;});});
    if(ready>0 && Math.random()>0.7){
        sendNotification('🌱 Цветы готовы!',`${ready} цветов ждут сбора`);
    }
    checkTimeout();processBees();checkEvent();generateQuests();
    renderGarden();updateUI();
}

document.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click',function(){
        document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
        this.classList.add('active');let n=this.dataset.tab;
        document.getElementById('tab-'+n).classList.add('active');
        if(n==='achievements')renderAchievements();
        else if(n==='more')renderMore();
        else render();
        document.getElementById('mainContent').scrollTop=0;
    });
});
