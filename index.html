<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌿 GARDEN LEGACY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#fdf6f0;--bg2:#f0e8f5;--card:rgba(255,248,250,.9);--text:#4a3a5a;--text2:#6b5a7a;--border:rgba(200,180,220,.2);--btn:rgba(200,180,220,.2);--btn-text:#4a3a5a;--gold:#f5a623;--green:#7ed321;--red:#d34a4a;--tab-bg:rgba(200,180,220,.15);--tab-active:rgba(200,180,220,.35);--rare:#4a90d9;--epic:#9b59b6;--legendary:#f39c12}
.dark{--bg:#1a1520;--bg2:#251f30;--card:rgba(40,35,50,.9);--text:#d4c8e0;--text2:#a898b0;--border:rgba(100,80,120,.3);--btn:rgba(100,80,120,.3);--btn-text:#c8b8d4;--tab-bg:rgba(100,80,120,.2);--tab-active:rgba(100,80,120,.4)}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;padding:8px;display:flex;justify-content:center;align-items:center}
.app{max-width:420px;width:100%;background:var(--card);border-radius:32px;padding:14px 12px 16px;box-shadow:0 20px 60px var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;height:100vh;max-height:780px}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;padding-bottom:8px;border-bottom:2px solid var(--border);flex-shrink:0}
.shop-name{font-size:17px;font-weight:800;color:var(--text)}
.shop-name span{font-weight:400;font-size:12px;opacity:.6}
.header-right{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.coins{background:rgba(255,215,0,.15);padding:2px 10px;border-radius:30px;font-weight:600;color:#8a7a3a;font-size:13px;border:1px solid rgba(255,215,0,.2)}
.time-badge{font-size:11px;color:var(--text2);background:rgba(200,180,220,.15);padding:2px 8px;border-radius:30px}
.rank-badge{font-size:10px;padding:2px 8px;border-radius:30px;font-weight:700;color:#fff}
.rank-badge.novice{background:#95a5a6}
.rank-badge.gardener{background:#27ae60}
.rank-badge.florist{background:#2980b9}
.rank-badge.master{background:#8e44ad}
.rank-badge.king{background:#f39c12}
.rank-badge.legend{background:linear-gradient(135deg,#f1c40f,#e67e22)}
.main-content{flex:1;overflow-y:auto;padding:4px 0;margin-bottom:4px}
.main-content::-webkit-scrollbar{width:3px}
.main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.garden-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.bed,.pot{background:var(--border);border-radius:12px;padding:6px 8px;border:2px solid var(--border);position:relative}
.pot{border-color:var(--gold);background:rgba(245,166,35,.08)}
.pot .pot-icon{position:absolute;top:-4px;right:-4px;font-size:16px}
.bed .bee-icon{position:absolute;top:-4px;right:-4px;font-size:16px;animation:fly 2s ease-in-out infinite}
@keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
.bed-title{font-size:10px;font-weight:600;color:var(--text);margin-bottom:3px;display:flex;justify-content:space-between}
.bed-slots{display:grid;gap:3px}
.bed-slots.slots-4{grid-template-columns:repeat(4,1fr)}
.bed-slots.slots-5{grid-template-columns:repeat(5,1fr)}
.bed-slots.slots-6{grid-template-columns:repeat(6,1fr)}
.pot .bed-slots{grid-template-columns:1fr}
.slot{aspect-ratio:1/1;border-radius:8px;background:var(--bg);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s;position:relative}
.slot:active{transform:scale(.92)}
.slot.has-flower{background:rgba(150,200,100,.15);border:2px solid rgba(150,200,100,.3)}
.slot.rare{background:rgba(74,144,217,.15);border-color:#4a90d9}
.slot.epic{background:rgba(155,89,182,.15);border-color:#9b59b6}
.slot.legendary{background:rgba(243,156,18,.15);border-color:#f39c12;animation:legendGlow 1.5s ease infinite alternate}
@keyframes legendGlow{0%{box-shadow:0 0 5px rgba(243,156,18,.3)}100%{box-shadow:0 0 20px rgba(243,156,18,.6)}}
.slot.growing{border-color:rgba(100,150,255,.4);background:rgba(100,150,255,.1)}
.slot.growing-fast{border-color:var(--gold);background:rgba(245,166,35,.1);animation:fastGlow .8s ease infinite alternate}
@keyframes fastGlow{0%{box-shadow:0 0 5px rgba(245,166,35,.2)}100%{box-shadow:0 0 15px rgba(245,166,35,.5)}}
.slot.ready{border-color:rgba(255,200,50,.5);background:rgba(255,200,50,.15);animation:glow 1s ease infinite alternate;cursor:pointer}
@keyframes glow{0%{box-shadow:0 0 5px rgba(255,200,50,.2)}100%{box-shadow:0 0 12px rgba(255,200,50,.4)}}
.slot .progress{position:absolute;bottom:2px;left:3px;right:3px;height:3px;background:rgba(0,0,0,.05);border-radius:4px;overflow:hidden}
.slot .progress-fill{height:100%;background:linear-gradient(90deg,#8ab4f8,#6a9ef0);border-radius:4px;transition:width 1s linear}
.slot .progress-fill.fast{background:linear-gradient(90deg,#f5a623,#f7c948)}
.slot .seed-icon{font-size:9px;opacity:.5}
.garden-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.garden-actions .btn,.btn{padding:8px 16px;border:none;border-radius:30px;font-weight:600;font-size:12px;cursor:pointer;transition:.2s;background:var(--btn);color:var(--btn-text);text-align:center;min-height:40px}
.btn:active{transform:scale(.94)}
.btn-primary{background:rgba(150,200,120,.25);color:#4a7a3a}
.btn-gold{background:rgba(255,215,0,.2);color:#8a7a3a}
.btn-red{background:rgba(255,100,100,.15);color:#8a4a4a}
.btn-green{background:rgba(100,200,100,.2);color:#3a7a3a}
.btn-blue{background:rgba(100,150,255,.2);color:#3a5a8a}
.btn-purple{background:rgba(180,130,200,.2);color:#5a4a6b}
.btn-gold-bg{background:rgba(245,166,35,.2);color:#8a6a20}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{font-size:10px;padding:4px 12px;min-height:32px}
.mail-card{background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:4px;border:1px solid var(--border)}
.mail-card.urgent{border-color:var(--red);background:rgba(212,74,74,.08)}
.mail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;flex-wrap:wrap;gap:3px}
.mail-title{font-weight:600;color:var(--text);font-size:12px}
.mail-timer{font-size:11px;color:var(--text2)}
.mail-desc{font-size:12px;color:var(--text);margin-bottom:4px}
.mail-actions{display:flex;gap:4px;flex-wrap:wrap}
.mail-actions .btn{flex:1;padding:6px 12px;font-size:12px;min-width:60px;min-height:36px}
.mail-status{font-size:11px;color:var(--text2);text-align:center;padding:3px}
.workbench{background:rgba(240,230,220,.2);border-radius:12px;padding:8px;min-height:60px;border:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;margin-bottom:4px}
.workbench .slot{width:42px;height:42px;font-size:20px;border-radius:8px;background:var(--bg);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.workbench .slot.has-flower{border:2px solid rgba(150,200,100,.4);background:rgba(150,200,100,.15)}
.inventory{display:flex;flex-wrap:wrap;gap:3px;padding:3px 0}
.inv-item{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:12px;border:1px solid var(--border);display:flex;align-items:center;gap:4px;cursor:pointer;transition:.2s;color:var(--text);min-height:34px}
.inv-item:active{transform:scale(.92)}
.inv-item .count{font-weight:600;color:var(--text)}
.inv-item.rare{border-color:#4a90d9}
.inv-item.epic{border-color:#9b59b6}
.inv-item.legendary{border-color:#f39c12}
.shop-grid{display:grid;gap:4px}
.shop-item{background:var(--bg);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
.shop-item .info{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.shop-item .info .emoji{font-size:20px;flex-shrink:0}
.shop-item .info .name{font-weight:500;color:var(--text);font-size:12px}
.shop-item .info .price{font-size:10px;color:var(--text2)}
.shop-item .btn{flex:0 0 auto;padding:6px 14px;font-size:12px;min-height:36px}
.level-info{background:rgba(200,180,220,.1);border-radius:8px;padding:4px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:3px;color:var(--text);font-size:11px}
.bottom-tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:3px;padding-top:6px;border-top:2px solid var(--border);flex-shrink:0}
.tab{aspect-ratio:1/1;border:none;border-radius:10px;font-weight:600;font-size:9px;cursor:pointer;transition:.3s;background:var(--tab-bg);color:var(--btn-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px}
.tab .tab-icon{font-size:16px}
.tab .tab-label{font-size:7px;opacity:.7}
.tab.active{background:var(--tab-active)}
.tab:active{transform:scale(.92)}
.tab-content{display:none}
.tab-content.active{display:block}
.hidden{display:none!important}
.overlay-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000}
.overlay-card{background:var(--card);border-radius:28px;padding:16px;max-width:400px;width:95%;max-height:95vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.2);border:1px solid var(--border)}
.overlay-card .close-btn{background:0 0;border:none;font-size:22px;cursor:pointer;color:var(--text2);padding:0 4px;float:right}
.overlay-card h3{color:var(--text);margin-bottom:6px;font-size:16px}
.overlay-card .tutorial-step{background:rgba(255,215,0,.1);border-radius:10px;padding:8px 10px;margin:4px 0;border-left:4px solid #e8b4d8}
.tutorial-step p{font-size:12px;color:var(--text2);line-height:1.4}
.achievement-popup{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f5a623,#f7c948);color:#4a3a5a;padding:8px 16px;border-radius:14px;font-weight:700;font-size:13px;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:slideDown .5s cubic-bezier(.34,1.56,.64,1),fadeOut .5s 3s forwards;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.3)}
.achievement-popup.dark{background:linear-gradient(135deg,#7b5ea7,#b28cd4);color:#fff}
@keyframes slideDown{0%{transform:translateX(-50%) translateY(-80px);opacity:0}100%{transform:translateX(-50%) translateY(0);opacity:1}}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.match3-board{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:300px;margin:6px auto;padding:4px;background:rgba(200,180,220,.1);border-radius:10px}
.match3-cell{aspect-ratio:1/1;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);cursor:pointer;transition:.1s;color:var(--text)}
.match3-cell.selected{border:3px solid #d8b4e6;transform:scale(.9)}
.match3-cell.pop-out{animation:popOut .25s ease forwards}
@keyframes popOut{0%{transform:scale(1);opacity:1}100%{transform:scale(0) rotate(15deg);opacity:0}}
.match3-cell.pop-in{animation:popIn .3s cubic-bezier(.34,1.56,.64,1) forwards}
@keyframes popIn{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.match3-cell.falling{animation:fallDown .4s cubic-bezier(.34,1.2,.64,1) forwards}
@keyframes fallDown{0%{transform:translateY(-50px) scale(.5);opacity:0}60%{transform:translateY(5px) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.match3-score{text-align:center;font-size:13px;font-weight:600;color:var(--text);padding:3px}
.chest-btn{background:rgba(255,215,0,.2);color:#8a7a3a;border:1px solid rgba(255,215,0,.2);font-size:10px;padding:3px 10px;animation:pulseChest 2s ease infinite}
@keyframes pulseChest{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
@media(max-width:480px){.app{padding:8px 6px 10px;border-radius:20px;max-height:100vh}.shop-name{font-size:15px}.slot{font-size:17px}.garden-grid{gap:4px}.tab .tab-icon{font-size:14px}.tab .tab-label{font-size:6px}}
</style>
</head>
<body>
<div class="app" id="app">
<div class="header">
<div class="shop-name">🌿 GARDEN LEGACY <span id="levelDisplay">⭐ 1</span></div>
<div class="header-right">
<span id="rankBadge" class="rank-badge novice">🌱 Новичок</span>
<span class="time-badge" id="timeDisplay">🕐</span>
<span class="coins">🪙 <span id="coinDisplay">250</span></span>
</div>
</div>

<div class="main-content" id="mainContent">
<div id="tab-garden" class="tab-content active"><div id="gardenContent"></div></div>
<div id="tab-mail" class="tab-content"><div id="mailContent"></div></div>
<div id="tab-workbench" class="tab-content"><div id="workbenchContent"></div></div>
<div id="tab-shop" class="tab-content"><div id="shopContent"></div></div>
<div id="tab-achievements" class="tab-content"><div id="achievementsContent"></div></div>
<div id="tab-more" class="tab-content"><div id="moreContent"></div></div>
</div>

<div class="bottom-tabs">
<button class="tab active" data-tab="garden"><span class="tab-icon">🌱</span><span class="tab-label">Сад</span></button>
<button class="tab" data-tab="mail"><span class="tab-icon">📬</span><span class="tab-label">Почта</span></button>
<button class="tab" data-tab="workbench"><span class="tab-icon">🔧</span><span class="tab-label">Верстак</span></button>
<button class="tab" data-tab="shop"><span class="tab-icon">🏪</span><span class="tab-label">Магазин</span></button>
<button class="tab" data-tab="achievements"><span class="tab-icon">🏆</span><span class="tab-label">Достиж.</span></button>
<button class="tab" data-tab="more"><span class="tab-icon">⚙️</span><span class="tab-label">Ещё</span></button>
</div>

<div id="match3Overlay" class="hidden overlay-bg">
<div class="overlay-card">
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><h3>🎮 Три в ряд</h3><button id="closeMatch3Btn" class="close-btn">✕</button></div>
<div id="match3Container"></div>
<div style="text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);"><button id="closeMatch3BtnBottom" class="btn btn-red" style="padding:6px 16px;font-size:13px;width:100%;">🚪 Выйти</button></div>
</div>
</div>
</div>

<script>
// ============================================================
// ДАННЫЕ
// ============================================================
const F={
rose:{e:'🌹',n:'Роза',c:5,p:10,r:'common',u:1},
tulip:{e:'🌷',n:'Тюльпан',c:7,p:15,r:'common',u:1},
chamomile:{e:'🌼',n:'Ромашка',c:19,p:30,r:'common',u:1},
sunflower:{e:'🌻',n:'Подсолнух',c:12,p:25,r:'common',u:2},
crocus:{e:'🌷',n:'Крокус',c:6,p:14,r:'common',u:2},
daisy:{e:'🌻',n:'Маргаритка',c:4,p:12,r:'common',u:2},
narcissus:{e:'🌼',n:'Нарцисс',c:14,p:28,r:'common',u:3},
aster:{e:'🌼',n:'Астра',c:11,p:24,r:'common',u:3},
lavender:{e:'🌻',n:'Лаванда',c:9,p:20,r:'common',u:3},
hibiscus:{e:'🌺',n:'Гибискус',c:8,p:18,r:'common',u:4},
peony:{e:'🌷',n:'Пион',c:10,p:22,r:'common',u:4},
hydrangea:{e:'🌹',n:'Гортензия',c:15,p:32,r:'common',u:4},
orchid:{e:'🌸',n:'Орхидея',c:20,p:35,r:'common',u:5},
lotus:{e:'🪷',n:'Лотос',c:25,p:40,r:'common',u:5},
waterlily:{e:'🪷',n:'Кувшинка',c:22,p:45,r:'common',u:5},
sakura:{e:'🌸',n:'Сакура',c:30,p:80,r:'rare',u:6},
golden_sunflower:{e:'🌻',n:'Золотой подсолнух',c:40,p:120,r:'rare',u:6},
blue_rose:{e:'🌹',n:'Голубая роза',c:80,p:300,r:'epic',u:11},
black_lotus:{e:'🪷',n:'Чёрный лотос',c:100,p:450,r:'epic',u:11},
diamond_flower:{e:'💎',n:'Алмазный цветок',c:200,p:1000,r:'legendary',u:16},
star_lily:{e:'🌟',n:'Звездная лилия',c:250,p:1500,r:'legendary',u:16}
};
const FK=Object.keys(F), GROW=60, ORDER_MIN=30, ORDER_MAX=120, ORDER_TO=300;
const NAMES=['Анна','Максим','Елена','Дмитрий','Ольга','Сергей','Наталья'];

// ============================================================
// СОСТОЯНИЕ (СТАРТОВЫЙ КАПИТАЛ 250)
// ============================================================
let G={coins:250,stars:1,beds:[],pots:[],bedCap:4,seeds:{},flowers:{},mail:[],nextOrder:0,fertilizers:0,bees:[],rating:0,ordersCompleted:0,flowersHarvested:0,seedsPlanted:0,achievements:{},dailyBonus:{claimed:!1,lastClaim:0},bank:0,bankTimer:0,loan:0,loanTimer:0,quests:{daily:[],lastReset:0},chests:0,playerName:'Садовод',rank:'novice',rareCollected:0,epicCollected:0,legendaryCollected:0,prestige:0,prestigeBonus:0,soundVolume:.5,tutorialShown:!1,stockPrices:{}};
let workbench=[], WB_MAX=6, plantPending=null, msgTimer=null, darkTheme=!1;

// ============================================================
// ДОСТИЖЕНИЯ
// ============================================================
const ACH={
first_flower:{e:'🌱',n:'Первый росток',d:'Посади цветок',need:1,type:'plant'},
green_thumb:{e:'🌿',n:'Зелёный палец',d:'Посади 50',need:50,type:'plant'},
first_harvest:{e:'🧺',n:'Первый урожай',d:'Собери цветок',need:1,type:'harvest'},
flower_power:{e:'🌸',n:'Цветочная сила',d:'Собери 100',need:100,type:'harvest'},
first_order:{e:'📬',n:'Первый заказ',d:'Выполни заказ',need:1,type:'order'},
courier:{e:'📦',n:'Курьер',d:'50 заказов',need:50,type:'order'},
first_coins:{e:'🪙',n:'Первая монета',d:'100 монет',need:100,type:'coins'},
rich_florist:{e:'💰',n:'Богатый флорист',d:'10000 монет',need:10000,type:'coins'},
bee_keeper:{e:'🐝',n:'Пчеловод',d:'Купи пчелу',need:1,type:'bee'},
level_5:{e:'⬆️',n:'Уровень 5',d:'5⭐',need:5,type:'stars'},
level_10:{e:'⬆️⬆️',n:'Уровень 10',d:'10⭐',need:10,type:'stars'},
level_15:{e:'⬆️⬆️⬆️',n:'Уровень 15',d:'15⭐',need:15,type:'stars'},
rare_collector:{e:'✨',n:'Коллекционер',d:'10 редких',need:10,type:'rare'},
epic_collector:{e:'💫',n:'Эпический',d:'5 эпических',need:5,type:'epic'},
legendary_collector:{e:'🌟',n:'Легендарный',d:'1 легендарный',need:1,type:'legendary'}
};

// ============================================================
// УВЕДОМЛЕНИЯ
// ============================================================
let achTimer=null;
function showAch(e,n){let old=document.querySelector('.achievement-popup');if(old)old.remove();let d=document.createElement('div');d.className='achievement-popup'+(darkTheme?' dark':'');d.innerHTML='🏆 '+e+' '+n;document.body.appendChild(d);if(achTimer)clearTimeout(achTimer);achTimer=setTimeout(()=>{if(d.parentNode)d.remove();},3500);}

function checkAch(type,val){
if(!G.achievements)G.achievements={};
let upd=!1;
Object.keys(ACH).forEach(k=>{
let a=ACH[k];
if(a.type===type){
if(!G.achievements[k])G.achievements[k]=0;
let nv=Math.min(G.achievements[k]+val,a.need);
if(nv!==G.achievements[k]){G.achievements[k]=nv;upd=!0;if(nv>=a.need)showAch(a.e,a.n);}
}
});
if(upd)save();
}

// ============================================================
// ОТКРЫТЫЕ ЦВЕТЫ
// ============================================================
function isAvail(k){return F[k].u<=Math.floor(G.stars);}
function getAvail(){return FK.filter(k=>isAvail(k));}

// ============================================================
// ЗВЁЗДЫ
// ============================================================
function addStars(v){
G.stars=Math.max(0,Math.min(15,G.stars+v));
updateRank();
save();
}

function updateRank(){
let s=Math.floor(G.stars),old=G.rank;
if(s>=15)G.rank='legend';

function genOrder(){

let avail=getAvail();if(!avail.length)avail=['rose','tulip','chamomile'];
let o={flowers:[],createdAt:Date.now(),accepted:!1,completed:!1,expired:!1,urgent,reward:0,client};
for(let i=0;i<c;i++){let k=avail[Math.floor(Math.random()*avail.length)];if(Math.random()<.05&&isAvail('sakura'))k='sakura';o.flowers.push(k);}
o.reward=o.flowers.reduce((s,k)=>s+Math.floor(G.stockPrices[k]||F[k].p),0);
o.timeoutAt=Date.now()+(urgent?60000:ORDER_TO*1000);

function orderDesc(o){let c={};o.flowers.forEach(f=>c[f]=(c[f]||0)+1);return Object.keys(c).map(k=>c[k]+' '+F[k].e+F[k].n).join(', ');}
function acceptOrder(i){let o=G.mail[i];if(!o||o.accepted||o.completed||o.expired)return;o.accepted=!0;save();render();msg('✅ Заказ принят!');}
function declineOrder(i){let o=G.mail[i];if(!o||o.accepted)return;G.mail.splice(i,1);addStars(-.2);save();render();msg('❌ Отказано (-0.2⭐)');}
function deliver(i){
let o=G.mail[i];if(!o||!o.accepted||o.completed||o.expired){msg('Нельзя выполнить');return;}
if(!workbench.length){msg('На верстаке нет цветов');return;}
let bench={};workbench.forEach(k=>bench[k]=(bench[k]||0)+1);
let need={};o.flowers.forEach(f=>need[f]=(need[f]||0)+1);
for(let k of Object.keys(need)){if((bench[k]||0)<need[k]){msg('Не хватает '+F[k].e+' '+F[k].n);return;}}
for(let k of Object.keys(need)){let c=need[k];for(let i=workbench.length-1;i>=0&&c>0;i--)if(workbench[i]===k){workbench.splice(i,1);c--;}}
let reward=Math.floor(o.reward*(1+G.prestigeBonus/100));
G.coins+=reward;G.ordersCompleted++;G.rating=Math.min(10,Math.floor(G.ordersCompleted/5)+Math.floor(G.stars));
addStars(.1);checkAch('order',1);checkAch('coins',reward);
if(G.ordersCompleted%10===0){G.chests=(G.chests||0)+1;showAch('🎁','Сундук получен!');}
o.completed=!0;save();render();S.play('complete');msg('🎉 +'+reward+'🪙 +0.1⭐');
setTimeout(()=>{let j=G.mail.indexOf(o);if(j!==-1){G.mail.splice(j,1);save();render();}},2000);
}
function checkTimeout(){
let now=Date.now(),ch=!1;
G.mail=G.mail.filter(o=>{
if(!o.accepted&&!o.completed&&!o.expired&&now>o.timeoutAt){addStars(-.2);ch=!0;return!1;}
if(o.accepted&&!o.completed&&!o.expired&&now>o.timeoutAt+(o.urgent?60000:180000)){addStars(-.2);o.expired=!0;ch=!0;}
if(o.expired||o.completed){if(now-o.timeoutAt>5000||o.completed){ch=!0;return!1;}}
return!0;
});
if(ch){save();render();}
}

// ============================================================
let m3B=[],m3S=null,m3Sc=0,m3P=!1;
const M3E=[...new Set(FK.map(k=>F[k].e))];
let m3MoveCount=0;

function initM3(){
m3B=[];m3MoveCount=0;
for(let r=0;r<7;r++){m3B[r]=[];for(let c=0;c<7;c++)m3B[r][c]=M3E[Math.floor(Math.random()*M3E.length)];}
let it=0;while(hasM3()&&it<50){it++;for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(isM3(r,c))m3B[r][c]=M3E[Math.floor(Math.random()*M3E.length)];}
m3S=null;m3Sc=0;m3P=!1;renderM3();
}

function hasM3(){for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(isM3(r,c))return!0;return!1;}
function isM3(r,c){let v=m3B[r][c];if(!v)return!1;if(c<=4&&m3B[r][c+1]===v&&m3B[r][c+2]===v)return!0;if(r<=4&&m3B[r+1][c]===v&&m3B[r+2][c]===v)return!0;return!1;}
function getAllM3(){let s=new Set();for(let r=0;r<7;r++)for(let c=0;c<7;c++){let v=m3B[r][c];if(!v)continue;if(c<=4&&m3B[r][c+1]===v&&m3B[r][c+2]===v){let e=c+2;while(e+1<7&&m3B[r][e+1]===v)e++;for(let i=c;i<=e;i++)s.add(r+','+i);}if(r<=4&&m3B[r+1][c]===v&&m3B[r+2][c]===v){let e=r+2;while(e+1<7&&m3B[e+1][c]===v)e++;for(let i=r;i<=e;i++)s.add(i+','+c);}}return s;}
function calcM3(s){let r=new Map,cl=new Map;for(let k of s){let [rr,cc]=k.split(',').map(Number);r.has(rr)||r.set(rr,[]);r.get(rr).push(cc);cl.has(cc)||cl.set(cc,[]);cl.get(cc).push(rr);}let t=0;for(let [_,p] of r){p.sort((a,b)=>a-b);let st=1;for(let i=1;i<p.length;i++){if(p[i]===p[i-1]+1)st++;else{t+=st>=3?st*2:0;st=1;}}t+=st>=3?st*2:0;}for(let [_,p] of cl){p.sort((a,b)=>a-b);let st=1;for(let i=1;i<p.length;i++){if(p[i]===p[i-1]+1)st++;else{t+=st>=3?st*2:0;st=1;}}t+=st>=3?st*2:0;}return t;}

async function procM3(){if(m3P)return;m3P=!0;let any=!1,it=0;while(it<20){it++;let matches=getAllM3();if(!matches.size)break;any=!0;let pts=calcM3(matches);m3Sc+=pts;document.getElementById('m3Score').textContent='⭐ '+m3Sc;S.play('match3');let cells=document.querySelectorAll('.match3-cell');for(let k of matches){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(cells[idx])cells[idx].classList.add('pop-out');}await new Promise(r=>setTimeout(r,300));for(let k of matches){let [r,c]=k.split(',').map(Number);m3B[r][c]=null;}let fall=[];for(let c=0;c<7;c++){let vals=[];for(let r=6;r>=0;r--)if(m3B[r][c]!==null)vals.push(m3B[r][c]);let idx=0;for(let r=6;r>=0;r--){if(idx<vals.length){m3B[r][c]=vals[idx];idx++;}else{m3B[r][c]=M3E[Math.floor(Math.random()*M3E.length)];fall.push(r+','+c);}}}renderM3();let c2=document.querySelectorAll('.match3-cell');for(let k of fall){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(c2[idx]){c2[idx].classList.remove('pop-in');c2[idx].classList.add('falling');}}await new Promise(r=>setTimeout(r,400));for(let k of fall){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(c2[idx])c2[idx].classList.remove('falling');}}
m3P=!1;
// ДАЁМ 2-3 МОНЕТЫ ЗА КАЖДОЕ СКРЕЩИВАНИЕ
if(any){
let reward=Math.floor(Math.random()*2)+2; // 2 или 3
G.coins+=reward;
save();updateUI();
document.getElementById('m3Reward').textContent='🪙 +'+reward+' монет';
S.play('win');
}
renderM3();
}

function onM3(r,c){if(m3P)return;if(!m3S){m3S={r,c};renderM3();return;}if(m3S.r===r&&m3S.c===c){m3S=null;renderM3();return;}let dr=Math.abs(m3S.r-r),dc=Math.abs(m3S.c-c);if((dr===1&&dc===0)||(dr===0&&dc===1)){let t=m3B[m3S.r][m3S.c];m3B[m3S.r][m3S.c]=m3B[r][c];m3B[r][c]=t;let sr=m3S.r,sc=m3S.c;m3S=null;renderM3();if(hasM3())procM3();else{let t2=m3B[sr][sc];m3B[sr][sc]=m3B[r][c];m3B[r][c]=t2;renderM3();msg('😌 Попробуйте другую');}}else{m3S={r,c};renderM3();}}

function takeLoan(){if(G.loan>0){msg('Кредит уже есть');return;}if(G.credits>=3){msg('Максимум 3');return;}let a=Math.min(500,Math.floor(Math.floor(G.stars)*50));G.coins+=a;G.loan=a;G.loanTimer=Date.now();G.credits++;save();render();msg('💳 Кредит '+a+' монет');}
function repayLoan(){if(!G.loan){msg('Нет кредита');return;}let a=Math.floor(G.loan*1.1);if(G.coins<a){msg('Нужно '+a);return;}G.coins-=a;G.loan=0;G.loanTimer=0;save();render();msg('✅ Кредит погашен!');}

function startTutorial(){
let steps=[{e:'🌿',t:'Добро пожаловать!',tx:'Ты — владелец цветочного магазина. Выполняй заказы и повышай уровень!'},{e:'⭐',t:'Звёзды (репутация)',tx:'За заказ +0.1⭐. За отказ/просрочку -0.2⭐. Чем больше ⭐ — тем больше открывается!'},{e:'🌱',t:'Уровни и цветы',tx:'1⭐ → 3 цветка, 2⭐ → 6, 3⭐ → 9, 4⭐ → 12, 5⭐ → все 15!'},{e:'✨',t:'Редкие цветы',tx:'Шанс: редкий 10%, эпический 3%, легендарный 0.5%!'},{e:'🏺',t:'Улучшения',tx:'6⭐ → горшки, 10⭐ → теплица!'},{e:'📬',t:'Заказы',tx:'Принимай заказы и собирай букеты на верстаке! +0.1⭐ за каждый!'},{e:'🌟',t:'Престиж',tx:'После 10⭐ можно переродиться с бонусом +10% к доходу!'}];
let cur=0,ov=document.createElement('div');ov.className='overlay-bg';ov.id='tutorialOverlay';
function show(){let s=steps[cur],last=cur===steps.length-1;ov.innerHTML='<div class="overlay-card"><button class="close-btn" onclick="closeTutorial()">✕</button><div style="text-align:center;font-size:36px;margin-bottom:4px;">'+s.e+'</div><h3>'+s.t+'</h3><div class="tutorial-step"><p>'+s.tx+'</p></div><div style="display:flex;gap:4px;margin-top:6px;"><button class="btn '+(cur>0?'':'disabled')+'" onclick="tutPrev()" '+(cur===0?'disabled':'')+'>⬅ Назад</button><button class="btn btn-primary" onclick="tutNext()">'+(last?'✅ Понятно!':'Далее ➡')+'</button></div><div style="text-align:center;margin-top:4px;font-size:10px;color:var(--text2);">'+(cur+1)+'/'+steps.length+'</div></div>';document.body.appendChild(ov);}
window.tutPrev=function(){if(cur>0){cur--;show();}};
window.tutNext=function(){if(cur<steps.length-1){cur++;show();}else{closeTutorial();G.tutorialShown=!0;save();}};
window.closeTutorial=function(){let el=document.getElementById('tutorialOverlay');if(el)el.remove();G.tutorialShown=!0;save();};
show();
}
function checkTut(){if(!G.tutorialShown)setTimeout(startTutorial,500);}

// ============================================================
// СООБЩЕНИЯ
// ============================================================
function msg(t){let b=document.querySelector('.message-box');if(!b){let d=document.createElement('div');d.className='message-box';d.style.cssText='position:fixed;bottom:65px;left:50%;transform:translateX(-50%);background:rgba(40,30,50,.85);color:#fff;padding:6px 14px;border-radius:16px;font-size:12px;z-index:1000;backdrop-filter:blur(8px);text-align:center;max-width:90%;transition:opacity .3s;opacity:0;';document.body.appendChild(d);b=d;}b.textContent=t;b.style.opacity='1';if(msgTimer)clearTimeout(msgTimer);msgTimer=setTimeout(()=>{b.style.opacity='0';setTimeout(()=>{if(b.parentNode)b.remove();},400);},2500);}

// ============================================================
// ЦИКЛ
// ============================================================
function loop(){
updateUI();bankInterest();
let max=Math.min(3+G.rating,10);
if(G.mail.filter(o=>!o.completed).length<max){
if(!G.nextOrder||Date.now()>G.nextOrder){genOrder();G.nextOrder=Date.now()+(ORDER_MIN+Math.random()*(ORDER_MAX-ORDER_MIN))*1000;}
}
checkTimeout();processBees();genQuests();
renderGarden();updateUI();
}

// ============================================================
// ЗАПУСК
// ============================================================
if(!load()){initInv();initBeds();G.coins=250;}
if(!G.beds.length)initBeds();
FK.forEach(k=>{if(G.seeds[k]===undefined)G.seeds[k]=0;if(G.flowers[k]===undefined)G.flowers[k]=0;});
if(!G.quests.daily.length)genQuests();
initStock();

document.querySelectorAll('.tab').forEach(t=>{
t.addEventListener('click',function(){
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));
this.classList.add('active');
let n=this.dataset.tab;
document.getElementById('tab-'+n).classList.add('active');
if(n==='achievements')renderAchievements();
else if(n==='more')renderMore();
else render();
document.getElementById('mainContent').scrollTop=0;
});
});

document.getElementById('closeMatch3Btn').addEventListener('click',closeM3);
document.getElementById('closeMatch3BtnBottom').addEventListener('click',closeM3);
document.getElementById('match3Overlay').addEventListener('click',function(e){if(e.target===this)closeM3();});

render();checkTut();
setInterval(loop,1000);
setInterval(save,3000);
setInterval(()=>{updateUI();document.getElementById('timeDisplay').textContent='🕐 '+timeStr();},60000);

console.log('🌿 GARDEN LEGACY v14.0 — ЗАКАЗ ПОД ВЕРСТАКОМ, СТАРТ 250, ТРИ В РЯД ДАЁТ МОНЕТЫ!');
</script>
</body>
</html>
