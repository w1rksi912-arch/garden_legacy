<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>📖 Рецепты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }
        :root {
            --bg: #fdf6f0;
            --bg2: #f5ede5;
            --card: #ffffff;
            --text: #2d2d2d;
            --text2: #666666;
            --border: #e0d6cc;
            --btn: #f0e6da;
            --btn-text: #2d2d2d;
            --accent: #c4956a;
            --green: #6b9e6b;
            --red: #c95a5a;
            --input: #faf6f0;
            --shadow: rgba(0,0,0,0.06);
        }
        .dark {
            --bg: #1a1510;
            --bg2: #2a221a;
            --card: #332a20;
            --text: #e8ddd0;
            --text2: #b8a898;
            --border: #4a3a2a;
            --btn: #4a3a2a;
            --btn-text: #e8ddd0;
            --input: #3a2a1a;
            --shadow: rgba(0,0,0,0.3);
        }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .app {
            max-width: 480px;
            width: 100%;
            background: var(--card);
            border-radius: 28px;
            padding: 16px;
            box-shadow: 0 8px 40px var(--shadow);
            border: 1px solid var(--border);
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 14px;
            border-bottom: 2px solid var(--border);
            flex-wrap: wrap;
            gap: 8px;
        }
        .header h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
        }
        .header-actions {
            display: flex;
            gap: 6px;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
            background: var(--btn);
            color: var(--btn-text);
            min-height: 48px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            touch-action: manipulation;
            user-select: none;
        }
        .btn:active {
            transform: scale(0.94);
        }
        .btn-primary {
            background: var(--accent);
            color: #fff;
        }
        .btn-green {
            background: var(--green);
            color: #fff;
        }
        .btn-red {
            background: var(--red);
            color: #fff;
        }
        .btn-sm {
            padding: 8px 16px;
            font-size: 13px;
            min-height: 40px;
        }
        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 8px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .main-content::-webkit-scrollbar {
            width: 4px;
        }
        .main-content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }

        /* Карточка рецепта */
        .recipe-card {
            background: var(--bg);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid var(--border);
            transition: 0.2s;
            cursor: pointer;
        }
        .recipe-card:active {
            transform: scale(0.98);
        }
        .recipe-card .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }
        .recipe-card .title {
            font-size: 17px;
            font-weight: 600;
            color: var(--text);
            flex: 1;
        }
        .recipe-card .category {
            font-size: 12px;
            color: var(--text2);
            background: var(--btn);
            padding: 4px 14px;
            border-radius: 30px;
            white-space: nowrap;
        }
        .recipe-card .desc {
            font-size: 13px;
            color: var(--text2);
            margin-top: 6px;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }
        .recipe-card .bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .recipe-card .meta {
            font-size: 12px;
            color: var(--text2);
            display: flex;
            gap: 14px;
            align-items: center;
        }
        .recipe-card .actions {
            display: flex;
            gap: 6px;
        }
        .recipe-card .actions .btn {
            min-height: 36px;
            padding: 6px 14px;
            font-size: 12px;
        }

        /* Пустое состояние */
        .empty-state {
            text-align: center;
            padding: 50px 20px;
            color: var(--text2);
        }
        .empty-state .icon {
            font-size: 64px;
            margin-bottom: 14px;
        }
        .empty-state h3 {
            font-size: 20px;
            color: var(--text);
            margin-bottom: 6px;
        }
        .empty-state p {
            font-size: 14px;
            margin-bottom: 18px;
        }

        /* Поиск */
        .search-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }
        .search-bar input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 2px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            min-height: 48px;
        }
        .search-bar input:focus {
            outline: none;
            border-color: var(--accent);
        }
        .search-bar input::placeholder {
            color: var(--text2);
            opacity: 0.6;
        }

        /* Модальное окно */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 16px;
        }
        .modal-overlay.show {
            display: flex;
        }
        .modal {
            background: var(--card);
            border-radius: 24px;
            padding: 24px;
            max-width: 460px;
            width: 100%;
            max-height: 95vh;
            overflow-y: auto;
            border: 1px solid var(--border);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal::-webkit-scrollbar {
            width: 3px;
        }
        .modal::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 10px;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid var(--border);
        }
        .modal-header h2 {
            font-size: 20px;
            color: var(--text);
        }
        .modal-close {
            background: none;
            border: none;
            font-size: 28px;
            color: var(--text2);
            cursor: pointer;
            padding: 0 6px;
            line-height: 1;
        }
        .modal-close:active {
            transform: scale(0.9);
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text2);
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--input);
            color: var(--text);
            font-size: 15px;
            font-family: inherit;
            transition: 0.2s;
            min-height: 48px;
        }
        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: var(--accent);
        }
        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }
        .form-group .char-count {
            font-size: 12px;
            color: var(--text2);
            text-align: right;
            margin-top: 3px;
        }
        .modal-footer {
            display: flex;
            gap: 10px;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        .modal-footer .btn {
            flex: 1;
            justify-content: center;
            min-height: 48px;
            font-size: 15px;
        }

        /* Подтверждение удаления */
        .confirm-modal .modal {
            max-width: 360px;
            text-align: center;
        }
        .confirm-modal .modal .icon-big {
            font-size: 56px;
            margin-bottom: 10px;
        }
        .confirm-modal .modal h3 {
            font-size: 20px;
            margin-bottom: 6px;
        }
        .confirm-modal .modal p {
            color: var(--text2);
            font-size: 15px;
            margin-bottom: 16px;
        }
        .confirm-modal .modal-footer .btn {
            flex: 0 0 auto;
            min-width: 100px;
        }

        /* Всплывающее сообщение */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(40,30,20,0.92);
            color: #fff;
            padding: 14px 24px;
            border-radius: 20px;
            font-size: 15px;
            z-index: 2000;
            backdrop-filter: blur(8px);
            max-width: 90%;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
        }

        /* Статистика */
        .footer-stats {
            text-align: center;
            font-size: 12px;
            color: var(--text2);
            padding-top: 10px;
            border-top: 2px solid var(--border);
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }
        .footer-stats span {
            padding: 4px 0;
        }

        /* Облачное сохранение */
        .cloud-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--text2);
            padding: 4px 12px;
            background: var(--btn);
            border-radius: 30px;
        }
        .cloud-status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }
        .cloud-status .dot.online {
            background: var(--green);
        }
        .cloud-status .dot.offline {
            background: var(--red);
        }

        @media (max-width: 480px) {
            .app {
                padding: 12px;
                border-radius: 20px;
                min-height: 95vh;
            }
            .header h1 {
                font-size: 20px;
            }
            .btn {
                font-size: 13px;
                padding: 8px 16px;
                min-height: 44px;
            }
            .btn-sm {
                padding: 6px 14px;
                font-size: 12px;
                min-height: 36px;
            }
            .recipe-card .title {
                font-size: 15px;
            }
            .modal {
                padding: 18px;
            }
            .form-group input,
            .form-group textarea,
            .form-group select {
                font-size: 14px;
                padding: 10px 12px;
                min-height: 44px;
            }
        }
    </style>
</head>
<body>
    <div class="app" id="app">
        <!-- Шапка -->
        <div class="header">
            <h1>📖 Рецепты</h1>
            <div class="header-actions">
                <button class="btn btn-sm" onclick="toggleTheme()">🌙</button>
                <button class="btn btn-primary btn-sm" onclick="openAddModal()">➕ Добавить</button>
            </div>
        </div>

        <!-- Поиск -->
        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Поиск..." oninput="renderRecipes()">
        </div>

        <!-- Список рецептов -->
        <div class="main-content" id="recipeList"></div>

        <!-- Статистика -->
        <div class="footer-stats">
            <span id="recipeCount">0 рецептов</span>
            <span class="cloud-status" id="cloudStatus">
                <span class="dot online" id="cloudDot"></span>
                <span id="cloudText">облако</span>
            </span>
        </div>
    </div>

    <!-- Модалка добавления/редактирования -->
    <div class="modal-overlay" id="recipeModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">✨ Новый рецепт</h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div class="form-group">
                <label>📝 Название</label>
                <input type="text" id="recipeName" placeholder="Название рецепта" maxlength="50">
                <div class="char-count"><span id="nameCount">0</span>/50</div>
            </div>
            <div class="form-group">
                <label>📂 Категория</label>
                <select id="recipeCategory">
                    <option value="Выпечка">🥐 Выпечка</option>
                    <option value="Супы">🍲 Супы</option>
                    <option value="Вторые блюда">🍖 Вторые блюда</option>
                    <option value="Салаты">🥗 Салаты</option>
                    <option value="Заготовки">🫙 Заготовки</option>
                    <option value="Десерты">🍰 Десерты</option>
                    <option value="Напитки">🧃 Напитки</option>
                    <option value="Другое">📦 Другое</option>
                </select>
            </div>
            <div class="form-group">
                <label>📋 Ингредиенты</label>
                <textarea id="recipeIngredients" placeholder="Список ингредиентов" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>📖 Приготовление</label>
                <textarea id="recipeInstructions" placeholder="Как приготовить" rows="4"></textarea>
            </div>
            <div class="form-group">
                <label>⏱️ Время (минут)</label>
                <input type="number" id="recipeTime" placeholder="30" min="5" max="999">
            </div>
            <div class="modal-footer">
                <button class="btn btn-red" id="deleteBtn" style="display:none;" onclick="deleteRecipe()">🗑️ Удалить</button>
                <button class="btn btn-primary" onclick="saveRecipe()">💾 Сохранить</button>
                <button class="btn" onclick="closeModal()">Отмена</button>
            </div>
            <input type="hidden" id="editIndex" value="-1">
        </div>
    </div>

    <!-- Подтверждение удаления -->
    <div class="modal-overlay confirm-modal" id="confirmModal">
        <div class="modal">
            <div class="icon-big">🗑️</div>
            <h3>Удалить рецепт?</h3>
            <p id="confirmText">Вы уверены?</p>
            <div class="modal-footer" style="justify-content:center;">
                <button class="btn" onclick="closeConfirm()">Отмена</button>
                <button class="btn btn-red" id="confirmDeleteBtn" onclick="confirmDelete()">Да, удалить</button>
            </div>
        </div>
    </div>

    <!-- Всплывающее сообщение -->
    <div class="toast" id="toast"></div>

    <script>
        // ============================================================
        // ДАННЫЕ
        // ============================================================
        let recipes = [];
        let editingIndex = -1;
        let deletingIndex = -1;
        let darkTheme = false;

        // ============================================================
        // ОБЛАЧНОЕ СОХРАНЕНИЕ (имитация)
        // ============================================================
        let cloudOnline = true;

        function checkCloudStatus() {
            // Имитация проверки облака
            cloudOnline = navigator.onLine !== false;
            const dot = document.getElementById('cloudDot');
            const text = document.getElementById('cloudText');
            if (cloudOnline) {
                dot.className = 'dot online';
                text.textContent = 'облако ✓';
            } else {
                dot.className = 'dot offline';
                text.textContent = 'офлайн';
            }
        }

        function syncToCloud() {
            if (!cloudOnline) return;
            try {
                // Имитация отправки в облако
                const data = JSON.stringify({ recipes: recipes, timestamp: Date.now() });
                // В реальном приложении здесь был бы fetch() к серверу
                console.log('☁️ Синхронизация с облаком...');
                // Сохраняем в localStorage как резервную копию
                localStorage.setItem('recipes_cloud_backup', data);
                showToast('☁️ Сохранено в облаке');
            } catch (e) {
                console.warn('Ошибка синхронизации:', e);
            }
        }

        function loadFromCloud() {
            try {
                const backup = localStorage.getItem('recipes_cloud_backup');
                if (backup) {
                    const data = JSON.parse(backup);
                    if (data.recipes && data.recipes.length > 0) {
                        // Если в облаке есть рецепты и локально пусто, загружаем из облака
                        if (recipes.length === 0) {
                            recipes = data.recipes;
                            showToast('☁️ Загружено из облака');
                            return true;
                        }
                    }
                }
            } catch (e) {}
            return false;
        }

        // ============================================================
        // ЗАГРУЗКА / СОХРАНЕНИЕ
        // ============================================================
        function loadData() {
            try {
                const data = localStorage.getItem('recipes_data');
                if (data) {
                    const parsed = JSON.parse(data);
                    recipes = parsed.recipes || [];
                    darkTheme = parsed.darkTheme || false;
                    if (darkTheme) {
                        document.body.classList.add('dark');
                        document.querySelector('.header-actions .btn-sm').textContent = '☀️';
                    }
                }
            } catch (e) {
                recipes = [];
            }

            // Если рецептов нет, пробуем загрузить из облака
            if (!recipes.length) {
                loadFromCloud();
            }

            // Если всё ещё пусто, оставляем пустым
            if (!recipes.length) {
                recipes = [];
            }
        }

        function saveData() {
            try {
                localStorage.setItem('recipes_data', JSON.stringify({
                    recipes: recipes,
                    darkTheme: darkTheme
                }));
                // Автосинхронизация с облаком
                syncToCloud();
            } catch (e) {}
        }

        // ============================================================
        // ОТОБРАЖЕНИЕ
        // ============================================================
        function renderRecipes() {
            const list = document.getElementById('recipeList');
            const search = document.getElementById('searchInput').value.toLowerCase().trim();

            let filtered = recipes;
            if (search) {
                filtered = recipes.filter(r =>
                    r.name.toLowerCase().includes(search) ||
                    r.ingredients.toLowerCase().includes(search) ||
                    r.instructions.toLowerCase().includes(search)
                );
            }

            document.getElementById('recipeCount').textContent = recipes.length + ' рецептов';

            if (!filtered.length) {
                list.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">${recipes.length ? '🔍' : '📖'}</div>
                        <h3>${recipes.length ? 'Ничего не найдено' : 'Нет рецептов'}</h3>
                        <p>${recipes.length ? 'Попробуйте изменить поиск' : 'Добавьте свой первый рецепт'}</p>
                        ${!recipes.length ? '<button class="btn btn-primary" onclick="openAddModal()">➕ Добавить рецепт</button>' : ''}
                    </div>
                `;
                return;
            }

            // Сортировка по дате (новые сверху)
            const sorted = [...filtered].sort((a, b) => b.created - a.created);

            let html = '';
            sorted.forEach((r) => {
                const idx = recipes.indexOf(r);
                const ingLines = r.ingredients ? r.ingredients.split('\n').filter(l => l.trim()).length : 0;
                const instLines = r.instructions ? r.instructions.split('\n').filter(l => l.trim()).length : 0;
                const timeText = r.time ? `⏱️ ${r.time} мин` : '';

                html += `
                    <div class="recipe-card" onclick="openEditModal(${idx})">
                        <div class="top">
                            <span class="title">${escapeHtml(r.name)}</span>
                            <span class="category">${escapeHtml(r.category || 'Другое')}</span>
                        </div>
                        <div class="desc">${escapeHtml(r.ingredients ? r.ingredients.split('\n').slice(0, 3).join('; ') : 'Нет ингредиентов')}</div>
                        <div class="bottom">
                            <div class="meta">
                                <span>📋 ${ingLines} ингр.</span>
                                <span>📖 ${instLines} шагов</span>
                                ${timeText ? `<span>${timeText}</span>` : ''}
                            </div>
                            <div class="actions">
                                <button class="btn btn-sm" onclick="event.stopPropagation();openEditModal(${idx})">✏️</button>
                                <button class="btn btn-sm btn-red" onclick="event.stopPropagation();confirmDeleteRecipe(${idx})">🗑️</button>
                                <button class="btn btn-sm btn-green" onclick="event.stopPropagation();shareRecipe(${idx})">📤</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            list.innerHTML = html;
        }

        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ============================================================
        // МОДАЛЬНЫЕ ОКНА
        // ============================================================
        function openAddModal() {
            editingIndex = -1;
            document.getElementById('modalTitle').textContent = '✨ Новый рецепт';
            document.getElementById('recipeName').value = '';
            document.getElementById('recipeCategory').value = 'Выпечка';
            document.getElementById('recipeIngredients').value = '';
            document.getElementById('recipeInstructions').value = '';
            document.getElementById('recipeTime').value = '';
            document.getElementById('editIndex').value = '-1';
            document.getElementById('deleteBtn').style.display = 'none';
            document.getElementById('recipeModal').classList.add('show');
            setTimeout(() => document.getElementById('recipeName').focus(), 100);
            updateCharCount();
        }

        function openEditModal(index) {
            const r = recipes[index];
            if (!r) return;
            editingIndex = index;
            document.getElementById('modalTitle').textContent = '✏️ Редактировать';
            document.getElementById('recipeName').value = r.name || '';
            document.getElementById('recipeCategory').value = r.category || 'Другое';
            document.getElementById('recipeIngredients').value = r.ingredients || '';
            document.getElementById('recipeInstructions').value = r.instructions || '';
            document.getElementById('recipeTime').value = r.time || '';
            document.getElementById('editIndex').value = index;
            document.getElementById('deleteBtn').style.display = 'inline-flex';
            document.getElementById('recipeModal').classList.add('show');
            updateCharCount();
        }

        function closeModal() {
            document.getElementById('recipeModal').classList.remove('show');
        }

        function updateCharCount() {
            const name = document.getElementById('recipeName').value;
            document.getElementById('nameCount').textContent = name.length;
        }

        document.getElementById('recipeName').addEventListener('input', updateCharCount);

        // ============================================================
        // СОХРАНЕНИЕ / УДАЛЕНИЕ
        // ============================================================
        function saveRecipe() {
            const name = document.getElementById('recipeName').value.trim();
            const category = document.getElementById('recipeCategory').value;
            const ingredients = document.getElementById('recipeIngredients').value.trim();
            const instructions = document.getElementById('recipeInstructions').value.trim();
            const time = parseInt(document.getElementById('recipeTime').value) || 0;

            if (!name) {
                showToast('❌ Введите название рецепта');
                return;
            }
            if (!ingredients) {
                showToast('❌ Добавьте ингредиенты');
                return;
            }
            if (!instructions) {
                showToast('❌ Добавьте инструкцию приготовления');
                return;
            }

            const idx = parseInt(document.getElementById('editIndex').value);

            if (idx >= 0 && idx < recipes.length) {
                recipes[idx] = {
                    ...recipes[idx],
                    name,
                    category,
                    ingredients,
                    instructions,
                    time
                };
                showToast('✅ Рецепт обновлён');
            } else {
                recipes.push({
                    name,
                    category,
                    ingredients,
                    instructions,
                    time,
                    created: Date.now()
                });
                showToast('✅ Рецепт добавлен');
            }

            saveData();
            closeModal();
            renderRecipes();
        }

        function confirmDeleteRecipe(index) {
            deletingIndex = index;
            const r = recipes[index];
            document.getElementById('confirmText').textContent = `Удалить "${r.name}"?`;
            document.getElementById('confirmModal').classList.add('show');
        }

        function confirmDelete() {
            if (deletingIndex >= 0 && deletingIndex < recipes.length) {
                const name = recipes[deletingIndex].name;
                recipes.splice(deletingIndex, 1);
                saveData();
                renderRecipes();
                showToast(`🗑️ "${name}" удалён`);
            }
            closeConfirm();
        }

        function deleteRecipe() {
            const idx = parseInt(document.getElementById('editIndex').value);
            if (idx >= 0 && idx < recipes.length) {
                closeModal();
                confirmDeleteRecipe(idx);
            }
        }

        function closeConfirm() {
            document.getElementById('confirmModal').classList.remove('show');
            deletingIndex = -1;
        }

        // ============================================================
        // ПОДЕЛИТЬСЯ
        // ============================================================
        function shareRecipe(index) {
            const r = recipes[index];
            if (!r) return;

            const text = `📖 ${r.name}\n\n📂 ${r.category}\n⏱️ ${r.time || 'Не указано'} мин.\n\n📋 Ингредиенты:\n${r.ingredients}\n\n📖 Приготовление:\n${r.instructions}`;

            if (navigator.share) {
                navigator.share({
                    title: r.name,
                    text: text,
                }).catch(() => {});
            } else {
                navigator.clipboard.writeText(text).then(() => {
                    showToast('📋 Рецепт скопирован');
                }).catch(() => {
                    const textarea = document.createElement('textarea');
                    textarea.value = text;
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                    showToast('📋 Рецепт скопирован');
                });
            }
        }

        // ============================================================
        // ТЕМА
        // ============================================================
        function toggleTheme() {
            darkTheme = !darkTheme;
            document.body.classList.toggle('dark', darkTheme);
            document.querySelector('.header-actions .btn-sm').textContent = darkTheme ? '☀️' : '🌙';
            saveData();
        }

        // ============================================================
        // ТОСТ (всплывающее сообщение)
        // ============================================================
        let toastTimer = null;

        function showToast(text) {
            const el = document.getElementById('toast');
            el.textContent = text;
            el.classList.add('show');
            if (toastTimer) clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                el.classList.remove('show');
            }, 2500);
        }

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        loadData();
        renderRecipes();
        checkCloudStatus();
        setInterval(checkCloudStatus, 30000);

        // Закрытие модалки по клику на фон
        document.getElementById('recipeModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });
        document.getElementById('confirmModal').addEventListener('click', function(e) {
            if (e.target === this) closeConfirm();
        });

        // Обработка Enter в полях
        document.getElementById('recipeName').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') document.getElementById('recipeIngredients').focus();
        });
        document.getElementById('recipeIngredients').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('recipeInstructions').focus();
            }
        });
        document.getElementById('recipeInstructions').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && e.ctrlKey) saveRecipe();
        });

        console.log('📖 Рецепты загружены');
        console.log('📋 Всего рецептов:', recipes.length);
    </script>
</body>
</html>
