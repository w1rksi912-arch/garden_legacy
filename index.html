<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>🌿 GARDEN LEGACY</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}
:root{--bg:#fdf6f0;--bg2:#f0e8f5;--card:rgba(255,248,250,.9);--text:#4a3a5a;--text2:#6b5a7a;--border:rgba(200,180,220,.2);--btn:rgba(200,180,220,.2);--btn-text:#4a3a5a;--gold:#f5a623;--green:#7ed321;--red:#d34a4a;--tab-bg:rgba(200,180,220,.15);--tab-active:rgba(200,180,220,.35)}
.dark{--bg:#1a1520;--bg2:#251f30;--card:rgba(40,35,50,.9);--text:#d4c8e0;--text2:#a898b0;--border:rgba(100,80,120,.3);--btn:rgba(100,80,120,.3);--btn-text:#c8b8d4;--tab-bg:rgba(100,80,120,.2);--tab-active:rgba(100,80,120,.4)}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(160deg,var(--bg),var(--bg2));min-height:100vh;padding:8px;display:flex;justify-content:center;align-items:center}
.app{max-width:420px;width:100%;background:var(--card);border-radius:32px;padding:14px 12px 16px;box-shadow:0 20px 60px var(--shadow);border:1px solid var(--border);display:flex;flex-direction:column;height:100vh;max-height:780px}
.header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:4px;padding-bottom:8px;border-bottom:2px solid var(--border);flex-shrink:0}
.shop-name{font-size:17px;font-weight:800;color:var(--text)}
.shop-name span{font-weight:400;font-size:12px;opacity:.6}
.header-right{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.coins{background:rgba(255,215,0,.15);padding:2px 10px;border-radius:30px;font-weight:600;color:#8a7a3a;font-size:13px;border:1px solid rgba(255,215,0,.2)}
.time-badge{font-size:11px;color:var(--text2);background:rgba(200,180,220,.15);padding:2px 8px;border-radius:30px}
.rank-badge{font-size:10px;padding:2px 8px;border-radius:30px;font-weight:700;color:#fff}
.rank-badge.novice{background:#95a5a6}
.rank-badge.gardener{background:#27ae60}
.rank-badge.florist{background:#2980b9}
.rank-badge.master{background:#8e44ad}
.rank-badge.king{background:#f39c12}
.rank-badge.legend{background:linear-gradient(135deg,#f1c40f,#e67e22)}
.rating-stars{font-size:14px;color:var(--gold);letter-spacing:1px}
.reviews-btn{font-size:10px;padding:2px 10px;border-radius:30px;background:var(--btn);border:1px solid var(--border);cursor:pointer}
.pause-btn{font-size:14px;padding:2px 8px;border-radius:30px;background:var(--btn);border:1px solid var(--border);cursor:pointer;min-width:36px;text-align:center;transition:.3s}
.pause-btn.active{background:rgba(255,200,50,.2);border-color:var(--gold)}
.main-content{flex:1;overflow-y:auto;padding:4px 0;margin-bottom:4px}
.main-content::-webkit-scrollbar{width:3px}
.main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:10px}
.garden-grid{display:flex;flex-direction:column;gap:6px;margin-bottom:6px}
.bed,.pot{background:var(--border);border-radius:12px;padding:6px 8px;border:2px solid var(--border);position:relative}
.pot{max-width:120px;margin:0 auto;border-color:var(--gold);background:rgba(245,166,35,.08)}
.pot .pot-icon{position:absolute;top:-4px;right:-4px;font-size:16px}
.bed .bee-icon{position:absolute;top:-4px;right:-4px;font-size:16px;animation:fly 2s ease-in-out infinite}@keyframes fly{0%,100%{transform:translateY(0) rotate(-5deg)}50%{transform:translateY(-4px) rotate(5deg)}}
.bed-title{font-size:10px;font-weight:600;color:var(--text);margin-bottom:3px;display:flex;justify-content:space-between}
.bed-slots{display:grid;gap:3px}
.bed-slots.slots-4{grid-template-columns:repeat(4,1fr)}
.bed-slots.slots-5{grid-template-columns:repeat(5,1fr)}
.bed-slots.slots-6{grid-template-columns:repeat(6,1fr)}
.pot .bed-slots{grid-template-columns:repeat(2,1fr)}
.slot{aspect-ratio:1/1;border-radius:8px;background:var(--bg);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.2s;position:relative}
.slot:active{transform:scale(.92)}
.slot.has-flower{background:rgba(150,200,100,.15);border:2px solid rgba(150,200,100,.3)}
.slot.growing{border-color:rgba(100,150,255,.4);background:rgba(100,150,255,.1)}
.slot.growing-fast{border-color:var(--gold);background:rgba(245,166,35,.1);animation:fastGlow .8s ease infinite alternate}@keyframes fastGlow{0%{box-shadow:0 0 5px rgba(245,166,35,.2)}100%{box-shadow:0 0 15px rgba(245,166,35,.5)}}
.slot.ready{border-color:rgba(255,200,50,.5);background:rgba(255,200,50,.15);animation:glow 1s ease infinite alternate;cursor:pointer}@keyframes glow{0%{box-shadow:0 0 5px rgba(255,200,50,.2)}100%{box-shadow:0 0 12px rgba(255,200,50,.4)}}
.slot .progress{position:absolute;bottom:2px;left:3px;right:3px;height:3px;background:rgba(0,0,0,.05);border-radius:4px;overflow:hidden}
.slot .progress-fill{height:100%;background:linear-gradient(90deg,#8ab4f8,#6a9ef0);border-radius:4px;transition:width 1s linear}
.slot .progress-fill.fast{background:linear-gradient(90deg,#f5a623,#f7c948)}
.slot .seed-icon{font-size:9px;opacity:.5}
.garden-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.garden-actions .btn,.btn{padding:8px 16px;border:none;border-radius:30px;font-weight:600;font-size:12px;cursor:pointer;transition:.2s;background:var(--btn);color:var(--btn-text);text-align:center;min-height:40px}
.btn:active{transform:scale(.94)}
.btn-primary{background:rgba(150,200,120,.25);color:#4a7a3a}
.btn-gold{background:rgba(255,215,0,.2);color:#8a7a3a}
.btn-red{background:rgba(255,100,100,.15);color:#8a4a4a}
.btn-green{background:rgba(100,200,100,.2);color:#3a7a3a}
.btn-blue{background:rgba(100,150,255,.2);color:#3a5a8a}
.btn-purple{background:rgba(180,130,200,.2);color:#5a4a6b}
.btn-gold-bg{background:rgba(245,166,35,.2);color:#8a6a20}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn-sm{font-size:10px;padding:4px 12px;min-height:32px}
.mail-card{background:var(--bg);border-radius:10px;padding:8px 10px;margin-bottom:4px;border:1px solid var(--border)}
.mail-card.urgent{border-color:var(--red);background:rgba(212,74,74,.08)}
.mail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:3px;flex-wrap:wrap;gap:3px}
.mail-title{font-weight:600;color:var(--text);font-size:12px}
.mail-timer{font-size:11px;color:var(--text2)}
.mail-desc{font-size:12px;color:var(--text);margin-bottom:4px}
.mail-actions{display:flex;gap:4px;flex-wrap:wrap}
.mail-actions .btn{flex:1;padding:6px 12px;font-size:12px;min-width:60px;min-height:36px}
.mail-status{font-size:11px;color:var(--text2);text-align:center;padding:3px}
.workbench{background:rgba(240,230,220,.2);border-radius:12px;padding:8px;min-height:60px;border:2px dashed var(--border);display:flex;flex-wrap:wrap;gap:3px;align-items:center;justify-content:center;margin-bottom:4px}
.workbench .slot{width:42px;height:42px;font-size:20px;border-radius:8px;background:var(--bg);border:2px dashed var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer}
.workbench .slot.has-flower{border:2px solid rgba(150,200,100,.4);background:rgba(150,200,100,.15)}
.workbench .slot.wrap-slot{border-color:var(--gold);background:rgba(245,166,35,.1)}
.inventory{display:flex;flex-wrap:wrap;gap:3px;padding:3px 0}
.inv-item{background:var(--bg);border-radius:8px;padding:4px 10px;font-size:12px;border:1px solid var(--border);display:flex;align-items:center;gap:4px;cursor:pointer;transition:.2s;color:var(--text);min-height:34px}
.inv-item:active{transform:scale(.92)}
.inv-item .count{font-weight:600;color:var(--text)}
.shop-grid{display:grid;gap:4px}
.shop-item{background:var(--bg);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
.shop-item .info{display:flex;align-items:center;gap:6px;flex:1;min-width:0}
.shop-item .info .emoji{font-size:20px;flex-shrink:0}
.shop-item .info .name{font-weight:500;color:var(--text);font-size:12px}
.shop-item .info .price{font-size:10px;color:var(--text2)}
.shop-item .btn{flex:0 0 auto;padding:6px 14px;font-size:12px;min-height:36px}
.level-info{background:rgba(200,180,220,.1);border-radius:8px;padding:4px 10px;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:3px;color:var(--text);font-size:11px}
.bottom-tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;padding-top:6px;border-top:2px solid var(--border);flex-shrink:0}
.tab{aspect-ratio:1/1;border:none;border-radius:10px;font-weight:600;font-size:9px;cursor:pointer;transition:.3s;background:var(--tab-bg);color:var(--btn-text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:3px}
.tab .tab-icon{font-size:16px}
.tab .tab-label{font-size:7px;opacity:.7}
.tab.active{background:var(--tab-active)}
.tab:active{transform:scale(.92)}
.tab-content{display:none}
.tab-content.active{display:block}
.hidden{display:none!important}
.overlay-bg{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000}
.overlay-card{background:var(--card);border-radius:28px;padding:16px;max-width:400px;width:95%;max-height:95vh;overflow-y:auto;box-shadow:0 30px 60px rgba(0,0,0,.2);border:1px solid var(--border)}
.overlay-card .close-btn{background:0 0;border:none;font-size:22px;cursor:pointer;color:var(--text2);padding:0 4px;float:right}
.overlay-card h3{color:var(--text);margin-bottom:6px;font-size:16px}
.overlay-card .btn-group{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;justify-content:center}
.overlay-card .btn-group .btn{flex:0 0 auto;padding:10px 24px;font-size:14px}
.achievement-popup{position:fixed;top:10px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,#f5a623,#f7c948);color:#4a3a5a;padding:8px 16px;border-radius:14px;font-weight:700;font-size:13px;z-index:2000;box-shadow:0 8px 30px rgba(0,0,0,.3);animation:slideDown .5s cubic-bezier(.34,1.56,.64,1),fadeOut .5s 3s forwards;display:flex;align-items:center;gap:8px;border:2px solid rgba(255,255,255,.3)}
.achievement-popup.dark{background:linear-gradient(135deg,#7b5ea7,#b28cd4);color:#fff}@keyframes slideDown{0%{transform:translateX(-50%) translateY(-80px);opacity:0}100%{transform:translateX(-50%) translateY(0);opacity:1}}@keyframes fadeOut{0%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-20px)}}
.match3-board{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;max-width:300px;margin:6px auto;padding:4px;background:rgba(200,180,220,.1);border-radius:10px}
.match3-cell{aspect-ratio:1/1;border-radius:6px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:18px;border:1px solid var(--border);cursor:pointer;transition:.1s;color:var(--text)}
.match3-cell.selected{border:3px solid #d8b4e6;transform:scale(.9)}
.match3-cell.pop-out{animation:popOut .25s ease forwards}@keyframes popOut{0%{transform:scale(1);opacity:1}100%{transform:scale(0) rotate(15deg);opacity:0}}
.match3-cell.pop-in{animation:popIn .3s cubic-bezier(.34,1.56,.64,1) forwards}@keyframes popIn{0%{transform:scale(.2) rotate(-10deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
.match3-cell.falling{animation:fallDown .4s cubic-bezier(.34,1.2,.64,1) forwards}@keyframes fallDown{0%{transform:translateY(-50px) scale(.5);opacity:0}60%{transform:translateY(5px) scale(1.05);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.match3-score{text-align:center;font-size:13px;font-weight:600;color:var(--text);padding:3px}
.chest-btn{background:rgba(255,215,0,.2);color:#8a7a3a;border:1px solid rgba(255,215,0,.2);font-size:10px;padding:3px 10px;animation:pulseChest 2s ease infinite}@keyframes pulseChest{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.section-title{font-weight:600;color:var(--text);font-size:11px;margin:4px 0 3px}
.settings-inline{display:flex;gap:3px;flex-wrap:wrap;margin:3px 0}
.settings-inline .btn{flex:1;min-width:40px;font-size:9px;padding:3px 6px}
.volume-slider{width:100%;accent-color:#8a7a3a;background:var(--bg);border-radius:10px;height:4px}
.quest-item{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;background:var(--inv);border-radius:8px;margin-bottom:3px;border:1px solid var(--border);font-size:11px;color:var(--text)}
.quest-item .info{display:flex;align-items:center;gap:6px}
.quest-item .q-emoji{font-size:14px}
.quest-item .q-status.done{color:var(--green)}
.quest-item .q-status.progress{color:var(--gold)}
.achievement-card{background:var(--inv);border-radius:8px;padding:4px 10px;margin-bottom:3px;display:flex;justify-content:space-between;align-items:center;border:1px solid var(--border)}
.achievement-card .info{display:flex;align-items:center;gap:6px}
.achievement-card .info .ach-emoji{font-size:16px}
.achievement-card .info .ach-name{font-weight:500;color:var(--text);font-size:11px}
.achievement-card .info .ach-desc{font-size:9px;color:var(--text2)}
.achievement-card .ach-status{font-size:11px;font-weight:600}
.achievement-card .ach-status.done{color:var(--green)}
.achievement-card .ach-status.progress{color:var(--gold)}
.dev-console{background:rgba(0,0,0,.05);border-radius:8px;padding:8px;margin:4px 0;font-family:monospace;font-size:11px;border:1px solid var(--border)}
.dev-console input{width:100%;padding:4px 8px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-family:monospace;font-size:11px}
.dev-console .output{color:var(--text2);font-size:11px;padding:4px 0;min-height:20px;word-break:break-all}
.color-picker{display:flex;gap:4px;flex-wrap:wrap;margin:4px 0;padding:4px 0;justify-content:center}
.pot-color-btn{width:28px;height:28px;border-radius:50%;border:2px solid var(--border);cursor:pointer;margin:2px;transition:.2s}
.pot-color-btn.active{border-color:var(--gold);transform:scale(1.1)}
.pot-color-btn:active{transform:scale(.9)}
.shop-collapse-btn{background:var(--tab-bg);border:none;border-radius:10px;padding:8px 12px;font-weight:600;font-size:11px;cursor:pointer;transition:.3s;color:var(--btn-text);width:100%;text-align:left;display:flex;justify-content:space-between;align-items:center;margin:2px 0}
.shop-collapse-btn:active{transform:scale(.98)}
.shop-collapse-btn .arrow{transition:.3s}
.shop-collapse-btn .arrow.open{transform:rotate(180deg)}
.shop-collapse-content{overflow:hidden;max-height:0;transition:max-height .3s ease}
.shop-collapse-content.open{max-height:3000px}
.paused-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.3);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;z-index:500;flex-direction:column;pointer-events:none}
.paused-overlay.show{display:flex}
.paused-overlay .pause-icon{font-size:64px;color:#fff;text-shadow:0 4px 20px rgba(0,0,0,.3)}
.paused-overlay .pause-text{color:#fff;font-size:20px;font-weight:600;margin-top:8px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.paused-overlay .resume-btn{pointer-events:auto;margin-top:16px;padding:8px 24px;border-radius:30px;border:none;background:rgba(255,255,255,.2);backdrop-filter:blur(4px);color:#fff;font-size:16px;font-weight:600;cursor:pointer;transition:.2s}
.paused-overlay .resume-btn:active{transform:scale(.95)}
@media(max-width:480px){.app{padding:8px 6px 10px;border-radius:20px;max-height:100vh}.shop-name{font-size:15px}.slot{font-size:17px}.garden-grid{gap:4px}.tab .tab-icon{font-size:14px}.tab .tab-label{font-size:6px}}
</style>
</head>
<body>
<div class="app" id="app"><div class="header"><div class="shop-name">🌿 GARDEN LEGACY <span id="levelDisplay">⭐1</span></div><div class="header-right"><span id="ratingStars" class="rating-stars">☆☆☆☆☆</span><button class="reviews-btn" onclick="showReviews()">📝</button><button class="pause-btn" id="pauseBtn" onclick="togglePause()">⏸️</button><span id="rankBadge" class="rank-badge novice">🌱</span><span class="time-badge" id="timeDisplay">🕐</span><span class="coins">🪙<span id="coinDisplay">100</span></span></div></div>
<div class="paused-overlay" id="pausedOverlay"><div class="pause-icon">⏸️</div><div class="pause-text">Игра на паузе</div><button class="resume-btn" onclick="togglePause()">▶️ Продолжить</button></div>
<div class="main-content" id="mainContent"><div id="tab-garden" class="tab-content active"><div id="gardenContent"></div></div><div id="tab-mail" class="tab-content"><div id="mailContent"></div></div><div id="tab-workbench" class="tab-content"><div id="workbenchContent"></div></div><div id="tab-shop" class="tab-content"><div id="shopContent"></div></div><div id="tab-settings" class="tab-content"><div id="settingsContent"></div></div></div>
<div class="bottom-tabs"><button class="tab active" data-tab="garden"><span class="tab-icon">🌱</span><span class="tab-label">Сад</span></button><button class="tab" data-tab="mail"><span class="tab-icon">📬</span><span class="tab-label">Почта</span></button><button class="tab" data-tab="workbench"><span class="tab-icon">🔧</span><span class="tab-label">Верстак</span></button><button class="tab" data-tab="shop"><span class="tab-icon">🏪</span><span class="tab-label">Магазин</span></button><button class="tab" data-tab="settings"><span class="tab-icon">⚙️</span><span class="tab-label">Настройки</span></button></div>
<div id="match3Overlay" class="hidden overlay-bg"><div class="overlay-card"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><h3>🎮 Три в ряд</h3><button id="closeMatch3Btn" class="close-btn">✕</button></div><div id="match3Container"></div><div style="text-align:center;margin-top:6px;padding-top:6px;border-top:1px solid var(--border);"><button id="closeMatch3BtnBottom" class="btn btn-red" style="padding:6px 16px;font-size:13px;width:100%;">🚪 Выйти</button></div></div></div>
<div id="winOverlay" class="hidden overlay-bg"><div class="overlay-card" style="text-align:center;"><div style="font-size:64px;">🏆</div><h2 style="color:var(--text);font-size:24px;">Вы прошли игру!</h2><p style="color:var(--text2);font-size:16px;margin:8px 0;">Вы достигли 15 уровня и стали легендой садоводства!</p><div class="btn-group"><button class="btn btn-primary" onclick="startNewGamePlus()">🌟 Начать заново с бонусом</button><button class="btn btn-gold" onclick="closeWinScreen()">📖 Продолжить</button></div></div></div>
</div>
<script>
// ============================================================
// ДАННЫЕ
// ============================================================
const F={rose:{e:'🌹',n:'Роза',c:5,p:10,u:1},tulip:{e:'🌷',n:'Тюльпан',c:7,p:15,u:1},chamomile:{e:'🌼',n:'Ромашка',c:19,p:30,u:1},sunflower:{e:'🌻',n:'Подсолнух',c:12,p:25,u:2},crocus:{e:'🌷',n:'Крокус',c:6,p:14,u:2},daisy:{e:'🌻',n:'Маргаритка',c:4,p:12,u:2},narcissus:{e:'🌼',n:'Нарцисс',c:14,p:28,u:3},aster:{e:'🌼',n:'Астра',c:11,p:24,u:3},lavender:{e:'🌻',n:'Лаванда',c:9,p:20,u:3},hibiscus:{e:'🌺',n:'Гибискус',c:8,p:18,u:4},peony:{e:'🌷',n:'Пион',c:10,p:22,u:4},hydrangea:{e:'🌹',n:'Гортензия',c:15,p:32,u:4},orchid:{e:'🌸',n:'Орхидея',c:20,p:35,u:5},lotus:{e:'🪷',n:'Лотос',c:25,p:40,u:5},waterlily:{e:'🪷',n:'Кувшинка',c:22,p:45,u:5}};const FK=Object.keys(F), GROW=60, ORDER_TO=300, NAMES=['Анна','Максим','Елена','Дмитрий','Ольга','Сергей','Наталья','Алексей','Татьяна','Иван'];
const WRAP_TYPES={paper:{name:'Бумага',buy:5,sell:15,emoji:'📄'},ribbon:{name:'Крафт+лента',buy:10,sell:30,emoji:'🎀'},basket:{name:'Корзина',buy:20,sell:40,emoji:'🧺'},gift:{name:'Подарочная',buy:30,sell:60,emoji:'🎁'}};const WRAP_KEYS=Object.keys(WRAP_TYPES);
const SEEDLING_TYPES={small:{name:'Маленькая',mult:.7,grow:90,emoji:'🌱'},medium:{name:'Средняя',mult:1,grow:60,emoji:'🌿'},large:{name:'Большая',mult:1.4,grow:30,emoji:'🌳'}};const SEEDLING_KEYS=Object.keys(SEEDLING_TYPES);

function showAch(e,n){let old=document.querySelector('.achievement-popup');if(old)old.remove();let d=document.createElement('div');d.className='achievement-popup'+(darkTheme?' dark':'');d.innerHTML='🏆 '+e+' '+n;document.body.appendChild(d);if(achTimer)clearTimeout(achTimer);achTimer=setTimeout(()=>{if(d.parentNode)d.remove();},3500);}let achTimer=null;

function checkAch(type,val){if(!G.achievements)G.achievements={};let upd=!1;Object.keys(ACH).forEach(k=>{let a=ACH[k];if(a.type===type){if(!G.achievements[k])G.achievements[k]=0;let nv=Math.min(G.achievements[k]+val,a.need);if(nv!==G.achievements[k]){G.achievements[k]=nv;upd=!0;if(nv>=a.need)showAch(a.e,a.n);}}});if(upd)save();}

function updateUnlocked(){let s=Math.floor(G.stars);G.unlockedFlowers=[];FK.forEach(k=>{if(F[k].u<=s)G.unlockedFlowers.push(k);});}
function isAvail(k){return G.unlockedFlowers.includes(k);}
function getAvail(){return FK.filter(k=>isAvail(k));}
function getPraise(){return PRAISE[Math.floor(Math.random()*PRAISE.length)];}

function getOrderInterval(){let s=Math.floor(G.stars);return s<=4?100:s<=9?80:s<=14?60:40;}
function getOrderFlowerCount(){let s=Math.floor(G.stars);return s===1?Math.floor(Math.random()*3)+2:s<=5?Math.floor(Math.random()*4)+2:Math.floor(Math.random()*5)+2;}
function getUrgentFlowerCount(){let s=Math.floor(G.stars);return s<=6?Math.floor(Math.random()*2)+2:Math.floor(Math.random()*4)+2;}

function checkLevelUpReward(){let s=Math.floor(G.stars);if(s>=2&&!G.levelUpReward){G.coins+=100;G.levelUpReward=!0;G.beds.push({slots:Array(G.bedCap).fill(null).map(()=>({flower:null,plantedAt:null,fertilized:!1})),capacity:G.bedCap,hasBee:!1});save();render();showAch('🎁','+100 монет и +1 грядка!');msg('🎁 +100 монет и +1 грядка!');}}

function initBeds(){G.beds=[];G.pots=[];for(let i=0;i<Math.max(1,Math.floor(G.stars/3));i++){let cap=Math.min(G.bedCap,6);G.beds.push({slots:Array(cap).fill(null).map(()=>({flower:null,plantedAt:null,fertilized:!1})),capacity:cap,hasBee:!1});}}
function initInv(){FK.forEach(k=>G.flowers[k]=0);SEEDLING_KEYS.forEach(s=>FK.forEach(k=>G.seedlings[k+'_'+s]=0));WRAP_KEYS.forEach(k=>G.wraps[k]=0);}
function initStock(){if(!Object.keys(G.stockPrices).length)FK.forEach(k=>G.stockPrices[k]=F[k].p*(.8+Math.random()*.4));}

function save(){try{localStorage.setItem('shopData',JSON.stringify(G));}catch(e){}}
function load(){try{let d=JSON.parse(localStorage.getItem('shopData'));if(d){Object.assign(G,d);if(darkTheme)document.body.classList.add('dark');updateUnlocked();return 1;}}catch(e){}return 0;}
function resetGame(){if(!confirm('Сбросить всё?'))return;localStorage.removeItem('shopData');location.reload();}
function toggleTheme(){darkTheme=!darkTheme;document.body.classList.toggle('dark',darkTheme);save();}
function toggleFullscreen(){if(!document.fullscreenElement){document.documentElement.requestFullscreen().catch(()=>{});}else{document.exitFullscreen().catch(()=>{});}}

function setPauseState(state){if(G.paused===state)return;G.paused=state;let btn=document.getElementById('pauseBtn');let overlay=document.getElementById('pausedOverlay');if(G.paused){btn.textContent='▶️';btn.classList.add('active');overlay.classList.add('show');if(loopInterval){clearInterval(loopInterval);loopInterval=null;}}else{btn.textContent='⏸️';btn.classList.remove('active');overlay.classList.remove('show');if(!loopInterval){loopInterval=setInterval(loop,1000);}}save();}

document.addEventListener('visibilitychange',function(){if(document.hidden){if(!G.paused)setPauseState(true);}else{if(G.paused)setPauseState(false);}});

const S=new class{constructor(){this.ctx=null;try{this.ctx=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}play(t){if(!this.ctx||G.soundVolume<.01||G.paused)return;try{let o=this.ctx.createOscillator(),g=this.ctx.createGain();o.connect(g);g.connect(this.ctx.destination);g.gain.value=G.soundVolume*.12;let s={plant:[400,600,.12],harvest:[600,900,.15],order:[500,800,.2],complete:[400,600,.25],buy:[300,500,.3],error:[300,200,.2],match3:[500,900,.18],win:[400,1000,.4]};if(!s[t])return;let a=s[t];o.frequency.setValueAtTime(a[0],this.ctx.currentTime);o.frequency.exponentialRampToValueAtTime(a[1],this.ctx.currentTime+.15);g.gain.exponentialRampToValueAtTime(.001,this.ctx.currentTime+a[2]);o.start(this.ctx.currentTime);o.stop(this.ctx.currentTime+a[2]);}catch(e){}}};

function timeStr(){let n=new Date();return String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');}

function updateRank(){let s=Math.floor(G.stars),old=G.rank;G.rank=s>=15?'legend':s>=12?'king':s>=8?'master':s>=5?'florist':s>=3?'gardener':'novice';if(old!==G.rank&&G.rank!=='novice'){let n={novice:'🌱 Новичок',gardener:'🌿 Садовод',florist:'🌸 Цветовод',master:'🌺 Мастер',king:'👑 Король',legend:'🌟 Легенда'};showAch('⭐',n[G.rank]+'!');}}

function getSeedlingKey(f,s){return f+'_'+s;}
function getSeedlingCost(f,s){let base=Math.floor(G.stockPrices[f]||F[f].c);return Math.floor(base*SEEDLING_TYPES[s].mult);}

function plant(bi,si,k,s){if(G.paused){msg('Игра на паузе');return 0;}let bed=G.beds[bi];if(!bed||bed.slots[si].flower){msg('Здесь занято');return 0;}let sk=getSeedlingKey(k,s);if((G.seedlings[sk]||0)<=0){msg('Нет рассады');return 0;}if(!isAvail(k)){msg('Цветок закрыт');return 0;}G.seedlings[sk]--;bed.slots[si]={flower:k,plantedAt:Date.now(),fertilized:0,growTime:SEEDLING_TYPES[s].grow};G.seedsPlanted++;checkAch('plant',1);save();render();S.play('plant');msg('🌱 '+getPraise());return 1;}
function plantPot(pi,si,k,s){if(G.paused){msg('Игра на паузе');return 0;}let pot=G.pots[pi];if(!pot||pot.slots[si].flower){msg('Здесь занято');return 0;}let sk=getSeedlingKey(k,s);if((G.seedlings[sk]||0)<=0){msg('Нет рассады');return 0;}if(!isAvail(k)){msg('Цветок закрыт');return 0;}G.seedlings[sk]--;pot.slots[si]={flower:k,plantedAt:Date.now(),fertilized:0,growTime:SEEDLING_TYPES[s].grow};G.seedsPlanted++;checkAch('plant',1);save();render();S.play('plant');msg('🏺 '+getPraise());return 1;}
function harvest(bi,si){if(G.paused){msg('Игра на паузе');return;}let bed=G.beds[bi];if(!bed)return;let s=bed.slots[si];if(!s||!s.flower)return;let grow=s.growTime||GROW;let elapsed=(Date.now()-s.plantedAt)/1000;if(elapsed<grow){msg('⏳ Осталось '+Math.ceil(grow-elapsed)+' сек');return;}let key=s.flower,bonus=1+G.prestigeBonus/100,count=Math.floor(1*bonus);G.flowers[key]=(G.flowers[key]||0)+count;G.flowersHarvested+=count;checkAch('harvest',count);s.flower=null;s.plantedAt=null;s.fertilized=0;save();render();S.play('harvest');msg('🧺 '+getPraise());}
function harvestPot(pi,si){if(G.paused){msg('Игра на паузе');return;}let pot=G.pots[pi];if(!pot)return;let s=pot.slots[si];if(!s||!s.flower)return;let grow=s.growTime||GROW;let elapsed=(Date.now()-s.plantedAt)/1000;if(elapsed<grow){msg('⏳ Осталось '+Math.ceil(grow-elapsed)+' сек');return;}let key=s.flower,bonus=1+G.prestigeBonus/100,count=Math.floor(1*bonus);G.flowers[key]=(G.flowers[key]||0)+count;G.flowersHarvested+=count;checkAch('harvest',count);s.flower=null;s.plantedAt=null;s.fertilized=0;save();render();S.play('harvest');msg('🧺 '+getPraise());}
function progress(bi,si){if(G.paused)return 0;let bed=G.beds[bi];if(!bed)return null;let s=bed.slots[si];if(!s||!s.flower||!s.plantedAt)return null;let grow=s.growTime||GROW;let e=(Date.now()-s.plantedAt)/1000;return e>=grow?1:e/grow;}
function progressPot(pi,si){if(G.paused)return 0;let pot=G.pots[pi];if(!pot)return null;let s=pot.slots[si];if(!s||!s.flower||!s.plantedAt)return null;let grow=s.growTime||GROW;let e=(Date.now()-s.plantedAt)/1000;return e>=grow?1:e/grow;}
function harvestAll(){if(G.paused){msg('Игра на паузе');return;}let c=0;G.beds.forEach((bed,bi)=>{bed.slots.forEach((s,si)=>{if(s.flower&&progress(bi,si)>=1){let key=s.flower,bonus=1+G.prestigeBonus/100,count=Math.floor(1*bonus);G.flowers[key]=(G.flowers[key]||0)+count;G.flowersHarvested+=count;checkAch('harvest',count);s.flower=null;s.plantedAt=null;s.fertilized=0;c+=count;}});});G.pots.forEach((pot,pi)=>{pot.slots.forEach((s,si)=>{if(s.flower&&progressPot(pi,si)>=1){let key=s.flower,bonus=1+G.prestigeBonus/100,count=Math.floor(1*bonus);G.flowers[key]=(G.flowers[key]||0)+count;G.flowersHarvested+=count;checkAch('harvest',count);s.flower=null;s.plantedAt=null;s.fertilized=0;c+=count;}});});if(c>0){save();render();S.play('harvest');msg('🧺 '+getPraise());}else msg('Нет готовых цветов');}
function fertBed(bi,si){if(G.paused){msg('Игра на паузе');return;}let bed=G.beds[bi];if(!bed)return;let s=bed.slots[si];if(!s||!s.flower)return msg('Нет цветка');if(s.fertilized)return msg('Уже удобрено');if(G.fertilizers<=0)return msg('Нет удобрений');G.fertilizers--;s.fertilized=1;save();render();msg('🧪 Удобрено! Рост x2');}
function fertPot(pi,si){if(G.paused){msg('Игра на паузе');return;}let pot=G.pots[pi];if(!pot)return;let s=pot.slots[si];if(!s||!s.flower)return msg('Нет цветка');if(s.fertilized)return msg('Уже удобрено');if(G.fertilizers<=0)return msg('Нет удобрений');G.fertilizers--;s.fertilized=1;save();render();msg('🧪 Удобрено! Рост x2');}
function processBees(){if(G.paused)return;G.bees.forEach(bi=>{let bed=G.beds[bi];if(!bed)return;bed.slots.forEach((s,si)=>{if(s.flower&&progress(bi,si)>=1){let key=s.flower,bonus=1+G.prestigeBonus/100,count=Math.floor(1*bonus);G.flowers[key]=(G.flowers[key]||0)+count;G.flowersHarvested+=count;checkAch('harvest',count);s.flower=null;s.plantedAt=null;s.fertilized=0;}});});}

function genOrder(){if(G.paused)return;let c=getOrderFlowerCount(),urgent=Math.random()<.2;if(urgent)c=getUrgentFlowerCount();let client=NAMES[Math.floor(Math.random()*NAMES.length)],avail=getAvail();if(!avail.length)avail=['rose','tulip','chamomile'];let o={flowers:[],createdAt:Date.now(),accepted:0,completed:0,expired:0,urgent,reward:0,client,wrap:null,wrapPrice:0,emotion:EMOTIONS.new};for(let i=0;i<c;i++)o.flowers.push(avail[Math.floor(Math.random()*avail.length)]);let wrapKey=null;if(urgent&&Math.random()<.5)wrapKey='gift';else if(Math.random()<.3){let keys=WRAP_KEYS;wrapKey=keys[Math.floor(Math.random()*keys.length)];}if(wrapKey){o.wrap=wrapKey;o.wrapPrice=getWrapPrice(wrapKey);}let baseCost=o.flowers.reduce((s,k)=>s+Math.floor(G.stockPrices[k]||F[k].p),0);let reward=Math.floor(baseCost*1.8)+(o.wrapPrice||0);if(reward<baseCost+5)reward=baseCost+5+Math.floor(Math.random()*5);o.reward=reward;o.timeoutAt=Date.now()+(urgent?60000:ORDER_TO*1000);G.mail.push(o);save();S.play('order');render();let profit=o.reward-baseCost-(o.wrap?getWrapBuy(o.wrap):0);let emotion=urgent?EMOTIONS.urgent:EMOTIONS.new;msg('📬 '+emotion+' Заказ от '+client+(o.wrap?' (+'+WRAP_TYPES[o.wrap].name+')':'')+' (прибыль +'+profit+'🪙)');}
function orderDesc(o){let c={};o.flowers.forEach(f=>c[f]=(c[f]||0)+1);let parts=Object.keys(c).map(k=>c[k]+' '+F[k].e+F[k].n);if(o.wrap)parts.push(WRAP_TYPES[o.wrap].emoji+' '+WRAP_TYPES[o.wrap].name);return parts.join(', ');}
function getWrapPrice(t){return WRAP_TYPES[t].sell;}function getWrapBuy(t){return WRAP_TYPES[t].buy;}
function acceptOrder(i){if(G.paused){msg('Игра на паузе');return;}let o=G.mail[i];if(!o||o.accepted||o.completed||o.expired)return;o.accepted=1;o.emotion=EMOTIONS.accept;save();render();msg('✅ '+EMOTIONS.accept+' Заказ принят! 5 минут');}
function declineOrder(i){if(G.paused){msg('Игра на паузе');return;}let o=G.mail[i];if(!o||o.accepted)return;G.mail.splice(i,1);addStars(-.1);save();render();msg('❌ '+EMOTIONS.decline+' Отказано (-0.1⭐)');}
function deliver(i){if(G.paused){msg('Игра на паузе');return;}let o=G.mail[i];if(!o||!o.accepted||o.completed||o.expired){msg('Нельзя выполнить');return;}if(!workbench.length&&!wbWraps.length){msg('На верстаке нет цветов или упаковки');return;}let bench={};workbench.forEach(k=>bench[k]=(bench[k]||0)+1);let need={};o.flowers.forEach(f=>need[f]=(need[f]||0)+1);if(o.wrap){let hasWrap=wbWraps.some(w=>w===o.wrap);if(!hasWrap){msg('Нет упаковки: '+WRAP_TYPES[o.wrap].name+' на верстаке');return;}}for(let k of Object.keys(need)){if((bench[k]||0)<need[k]){msg('Не хватает '+F[k].e+' '+F[k].n);return;}}for(let k of Object.keys(need)){let c=need[k];for(let i=workbench.length-1;i>=0&&c>0;i--)if(workbench[i]===k){workbench.splice(i,1);c--;}}if(o.wrap){let idx=wbWraps.indexOf(o.wrap);if(idx!=-1)wbWraps.splice(idx,1);}let reward=Math.floor(o.reward*(1+G.prestigeBonus/100));let regBonus=getRegularBonus();if(regBonus>0)reward=Math.floor(reward*(1+regBonus/100));G.coins+=reward;G.ordersCompleted++;G.rating=Math.min(10,Math.floor(G.ordersCompleted/5)+Math.floor(G.stars));addStars(.1);checkAch('order',1);checkAch('coins',reward);if(G.ordersCompleted%10===0){G.chests=(G.chests||0)+1;showAch('🎁','Сундук получен!');}if(G.ordersCompleted%5===0&&o.client)addRegular(o.client);let stars=Math.min(5,3+Math.floor(Math.random()*3)+(o.urgent?1:0)+(o.wrap?1:0));addReview(stars);o.completed=1;let emotion=o.urgent?EMOTIONS.urgent:EMOTIONS.complete;if(G.regulars&&G.regulars.includes(o.client))emotion=EMOTIONS.vip;o.emotion=emotion;save();render();S.play('complete');let baseCost=o.flowers.reduce((s,k)=>s+Math.floor(G.stockPrices[k]||F[k].p),0);msg('🎉 '+emotion+' +'+reward+'🪙 (+'+(reward-baseCost-(o.wrap?getWrapBuy(o.wrap):0))+'🪙) +0.1⭐ | ⭐'+stars+'★');setTimeout(()=>{let j=G.mail.indexOf(o);if(j!=-1){G.mail.splice(j,1);save();render();}},2000);}
function checkTimeout(){if(G.paused)return;let now=Date.now(),ch=0;G.mail=G.mail.filter(o=>{if(!o.accepted&&!o.completed&&!o.expired&&now>o.timeoutAt){addStars(-.1);ch=1;return 0;}if(o.accepted&&!o.completed&&!o.expired&&now>o.timeoutAt+(o.urgent?60000:180000)){addStars(-.1);o.expired=1;ch=1;}if(o.expired||o.completed){if(now-o.timeoutAt>5000||o.completed){ch=1;return 0;}}return 1;});if(ch){save();render();}}

function buyUpgrade(t){if(G.paused){msg('Игра на паузе');return;}if(t==='level'){let c=Math.floor(Math.floor(G.stars)*300);if(G.coins<c){msg('Нужно '+c);return;}G.coins-=c;addStars(.5);save();render();msg('📢 Реклама запущена! +0.5⭐');}else if(t==='bed'){if(G.coins<500){msg('Нужно 500');return;}if(G.beds.length>=6){msg('Максимум 6 грядок');return;}G.coins-=500;let cap=Math.min(G.bedCap,6);G.beds.push({slots:Array(cap).fill(null).map(()=>({flower:null,plantedAt:null,fertilized:!1})),capacity:cap,hasBee:!1});save();render();msg('🛏️ Новая грядка!');}else if(t==='bedUpgrade'){if(G.coins<300){msg('Нужно 300');return;}if(G.bedCap>=6){msg('Максимум 6 слотов');return;}G.coins-=300;G.bedCap++;G.beds.forEach(b=>{while(b.slots.length<G.bedCap)b.slots.push({flower:null,plantedAt:null,fertilized:0});b.capacity=G.bedCap;});save();render();msg('⬆ +1 слот на грядках');}}
function buyPot(){if(G.paused){msg('Игра на паузе');return;}if(G.coins<100){msg('Нужно 100');return;}if(G.pots.length>=6){msg('Максимум 6 горшков');return;}G.coins-=100;G.pots.push({slots:[{flower:null,plantedAt:null,fertilized:0}],capacity:1});save();render();msg('🏺 Горшок куплен!');}
function upgradePot(){if(G.paused){msg('Игра на паузе');return;}if(G.coins<150){msg('Нужно 150');return;}if(!G.pots.length){msg('Нет горшков');return;}let targetCap=G.pots[0].slots.length+1;if(targetCap>6){msg('Максимум 6 слотов');return;}G.coins-=150;G.pots.forEach(p=>{p.slots.push({flower:null,plantedAt:null,fertilized:0});p.capacity=p.slots.length;});save();render();msg('🏺 Горшок улучшен до '+targetCap+' слотов!');}
function buySeedling(f,s){if(G.paused){msg('Игра на паузе');return;}if(!isAvail(f)){msg('Цветок закрыт');return;}let cost=getSeedlingCost(f,s);if(G.coins<cost){msg('Нужно '+cost);return;}let sk=getSeedlingKey(f,s);G.coins-=cost;G.seedlings[sk]=(G.seedlings[sk]||0)+1;save();render();msg('🌱 '+getPraise());}
function buyWrap(t){if(G.paused){msg('Игра на паузе');return;}let w=WRAP_TYPES[t];if(G.coins<w.buy){msg('Нужно '+w.buy);return;}G.coins-=w.buy;G.wraps[t]=(G.wraps[t]||0)+1;save();render();msg('📦 Куплена '+w.name);}
function buyFert(){if(G.paused){msg('Игра на паузе');return;}if(G.coins<100){msg('Нужно 100');return;}G.coins-=100;G.fertilizers=(G.fertilizers||0)+10;save();render();msg('🧪 '+getPraise());}
function buyBee(){if(G.paused){msg('Игра на паузе');return;}if(G.coins<400){msg('Нужно 400');return;}let fi=G.beds.findIndex(b=>!b.hasBee);if(fi==-1){msg('Все грядки с пчёлами');return;}G.coins-=400;G.beds[fi].hasBee=1;G.bees.push(fi);save();render();msg('🐝 Пчела на грядке '+(fi+1)+'!');}

let m3B=[],m3S=null,m3Sc=0,m3P=0;const M3E=[...new Set(FK.map(k=>F[k].e))];
function initM3(){m3B=[];for(let r=0;r<7;r++){m3B[r]=[];for(let c=0;c<7;c++)m3B[r][c]=M3E[Math.floor(Math.random()*M3E.length)];}let it=0;while(hasM3()&&it<50){it++;for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(isM3(r,c))m3B[r][c]=M3E[Math.floor(Math.random()*M3E.length)];}m3S=null;m3Sc=0;m3P=0;renderM3();}
function hasM3(){for(let r=0;r<7;r++)for(let c=0;c<7;c++)if(isM3(r,c))return 1;return 0;}
function isM3(r,c){let v=m3B[r][c];if(!v)return 0;if(c<=4&&m3B[r][c+1]===v&&m3B[r][c+2]===v)return 1;if(r<=4&&m3B[r+1][c]===v&&m3B[r+2][c]===v)return 1;return 0;}
function getAllM3(){let s=new Set();for(let r=0;r<7;r++)for(let c=0;c<7;c++){let v=m3B[r][c];if(!v)continue;if(c<=4&&m3B[r][c+1]===v&&m3B[r][c+2]===v){let e=c+2;while(e+1<7&&m3B[r][e+1]===v)e++;for(let i=c;i<=e;i++)s.add(r+','+i);}if(r<=4&&m3B[r+1][c]===v&&m3B[r+2][c]===v){let e=r+2;while(e+1<7&&m3B[e+1][c]===v)e++;for(let i=r;i<=e;i++)s.add(i+','+c);}}return s;}
function calcM3(s){let r=new Map,cl=new Map;for(let k of s){let [rr,cc]=k.split(',').map(Number);r.has(rr)||r.set(rr,[]);r.get(rr).push(cc);cl.has(cc)||cl.set(cc,[]);cl.get(cc).push(rr);}let t=0;for(let [_,p] of r){p.sort((a,b)=>a-b);let st=1;for(let i=1;i<p.length;i++){if(p[i]===p[i-1]+1)st++;else{t+=st>=3?st*2:0;st=1;}}t+=st>=3?st*2:0;}for(let [_,p] of cl){p.sort((a,b)=>a-b);let st=1;for(let i=1;i<p.length;i++){if(p[i]===p[i-1]+1)st++;else{t+=st>=3?st*2:0;st=1;}}t+=st>=3?st*2:0;}return t;}
async function procM3(){if(m3P)return;m3P=1;let any=0,it=0;while(it<20){it++;let matches=getAllM3();if(!matches.size)break;any=1;let pts=calcM3(matches);m3Sc+=pts;document.getElementById('m3Score').textContent='⭐ '+m3Sc;S.play('match3');let cells=document.querySelectorAll('.match3-cell');for(let k of matches){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(cells[idx])cells[idx].classList.add('pop-out');}await new Promise(r=>setTimeout(r,300));for(let k of matches){let [r,c]=k.split(',').map(Number);m3B[r][c]=null;}let fall=[];for(let c=0;c<7;c++){let vals=[];for(let r=6;r>=0;r--)if(m3B[r][c]!==null)vals.push(m3B[r][c]);let idx=0;for(let r=6;r>=0;r--){if(idx<vals.length){m3B[r][c]=vals[idx];idx++;}else{m3B[r][c]=M3E[Math.floor(Math.random()*M3E.length)];fall.push(r+','+c);}}}renderM3();let c2=document.querySelectorAll('.match3-cell');for(let k of fall){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(c2[idx]){c2[idx].classList.remove('pop-in');c2[idx].classList.add('falling');}}await new Promise(r=>setTimeout(r,400));for(let k of fall){let [r,c]=k.split(',').map(Number),idx=r*7+c;if(c2[idx])c2[idx].classList.remove('falling');}}m3P=0;if(any){let reward=Math.floor(Math.random()*2)+2;G.coins+=reward;save();updateUI();document.getElementById('m3Reward').textContent='🪙 +'+reward+' монет';S.play('win');}renderM3();}
function onM3(r,c){if(m3P)return;if(!m3S){m3S={r,c};renderM3();return;}if(m3S.r===r&&m3S.c===c){m3S=null;renderM3();return;}let dr=Math.abs(m3S.r-r),dc=Math.abs(m3S.c-c);if((dr===1&&dc===0)||(dr===0&&dc===1)){let t=m3B[m3S.r][m3S.c];m3B[m3S.r][m3S.c]=m3B[r][c];m3B[r][c]=t;let sr=m3S.r,sc=m3S.c;m3S=null;renderM3();if(hasM3())procM3();else{let t2=m3B[sr][sc];m3B[sr][sc]=m3B[r][c];m3B[r][c]=t2;renderM3();msg('😌 Попробуйте другую');}}else{m3S={r,c};renderM3();}}
function renderM3(){let el=document.getElementById('match3Container');let h='<div class="match3-score" id="m3Score">⭐ '+m3Sc+'</div><div class="match3-score" id="m3Reward" style="font-size:11px;color:var(--text2);">🪙 2-3 монеты за ход</div><div class="match3-board">';for(let r=0;r<7;r++)for(let c=0;c<7;c++){let v=m3B[r][c]||'🌸',sel=m3S&&m3S.r===r&&m3S.c===c;h+='<div class="match3-cell '+(sel?'selected':'')+'" onclick="onM3('+r+','+c+')" style="font-size:'+(window.innerWidth<480?'16px':'20px')+'">'+v+'</div>';}h+='</div><div style="text-align:center;margin-top:4px;"><button class="btn btn-primary" onclick="initM3()" style="padding:4px 14px;font-size:11px;">🔄 Новая</button></div>';el.innerHTML=h;}

if(cmd==='mani100'){G.coins+=100;save();render();out.innerHTML='💰 +100 монет!';updateUI();return;}
if(cmd==='mani50'){G.coins+=50;save();render();out.innerHTML='💰 +50 монет!';updateUI();return;}

function closePlantMenu(){let el=document.querySelector('.plant-menu-overlay');if(el)el.remove();plantPending=null;}
function plantFromMenu(k,s){if(!plantPending)return;if(plantPending.type==='bed')plant(plantPending.bedIdx,plantPending.slotIdx,k,s);else plantPot(plantPending.potIdx,plantPending.slotIdx,k,s);closePlantMenu();}
function showPlantMenuGlobal(){if(G.paused){msg('Игра на паузе');return;}for(let bi=0;bi<G.beds.length;bi++){let b=G.beds[bi];for(let si=0;si<b.slots.length;si++)if(!b.slots[si].flower){showPlantMenuBed(bi,si);return;}}for(let pi=0;pi<G.pots.length;pi++){let p=G.pots[pi];for(let si=0;si<p.slots.length;si++)if(!p.slots[si].flower){showPlantMenuPot(pi,si);return;}}msg('Все места заняты!');}

function openChest(){if(G.paused){msg('Игра на паузе');return;}if(G.chests<=0){msg('Нет сундуков!');return;}G.chests--;let r=Math.floor(Math.random()*100)+20+G.prestigeBonus*2;let avail=getAvail();if(!avail.length)avail=['rose','tulip','chamomile'];let k=avail[Math.floor(Math.random()*avail.length)];let cnt=Math.floor(Math.random()*5)+1;let s=SEEDLING_KEYS[Math.floor(Math.random()*SEEDLING_KEYS.length)];let sk=getSeedlingKey(k,s);G.seedlings[sk]=(G.seedlings[sk]||0)+cnt;G.coins+=r;showAch('🎁','+'+r+'🪙 +'+cnt+' '+SEEDLING_TYPES[s].name+' '+F[k].e);save();render();msg('🎁 Сундук: +'+r+'🪙, '+F[k].e+'x'+cnt);}
function bankDeposit(){if(G.paused){msg('Игра на паузе');return;}if(G.coins<10){msg('Минимум 10');return;}let a=Math.min(G.coins,1000);G.coins-=a;G.bank+=a;G.bankTimer=Date.now();save();render();msg('💰 +'+a+' в банк');}
function bankWithdraw(){if(G.paused){msg('Игра на паузе');return;}if(!G.bank){msg('В банке пусто');return;}G.coins+=G.bank;G.bank=0;save();render();msg('💰 +'+G.bank+' из банка');}
function bankInterest(){if(G.paused)return;if(!G.bank||!G.bankTimer)return;if((Date.now()-G.bankTimer)/86400000>=1){let i=Math.floor(G.bank*.05);G.bank+=i;G.bankTimer=Date.now();save();}}

function genQuests(){if(G.paused)return;let now=Date.now();if(now-G.quests.lastReset<86400000&&G.quests.daily.length)return;G.quests.daily=[{id:'plant',e:'🌱',n:'Садовод',desc:'Посади 10 цветов',need:10,progress:0,done:0},{id:'harvest',e:'🧺',n:'Сборщик',desc:'Собери 10 цветов',need:10,progress:0,done:0},{id:'orders',e:'📬',n:'Курьер',desc:'Выполни 3 заказа',need:3,progress:0,done:0},{id:'coins',e:'🪙',n:'Бизнесмен',desc:'Заработай 200 монет',need:200,progress:0,done:0}];G.quests.lastReset=now;save();}

function startTutorial(){let steps=[{e:'🌿',t:'Добро пожаловать!',tx:'Ты — владелец цветочного магазина. Выполняй заказы и повышай уровень!'},{e:'⭐',t:'Звёзды',tx:'За заказ +0.1⭐. За отказ/просрочку -0.1⭐.'},{e:'🌱',t:'Уровни и цветы',tx:'1⭐ → 3 цветка, 2⭐ → 6, 3⭐ → 9, 4⭐ → 12, 5⭐ → все 15!'},{e:'🏺',t:'Улучшения',tx:'6⭐ → горшки, 10⭐ → теплица!'},{e:'📬',t:'Заказы',tx:'Принимай заказы и собирай букеты на верстаке! +0.1⭐ за каждый!'}];let cur=0,ov=document.createElement('div');ov.className='overlay-bg';ov.id='tutorialOverlay';function show(){let s=steps[cur],last=cur===steps.length-1;ov.innerHTML='<div class="overlay-card"><button class="close-btn" onclick="closeTutorial()">✕</button><div style="text-align:center;font-size:36px;margin-bottom:4px;">'+s.e+'</div><h3>'+s.t+'</h3><div class="tutorial-step"><p>'+s.tx+'</p></div><div style="display:flex;gap:4px;margin-top:6px;"><button class="btn '+(cur>0?'':'disabled')+'" onclick="tutPrev()" '+(cur===0?'disabled':'')+'>⬅ Назад</button><button class="btn btn-primary" onclick="tutNext()">'+(last?'✅ Понятно!':'Далее ➡')+'</button></div><div style="text-align:center;margin-top:4px;font-size:10px;color:var(--text2);">'+(cur+1)+'/'+steps.length+'</div></div>';document.body.appendChild(ov);}window.tutPrev=function(){if(cur>0){cur--;show();}};window.tutNext=function(){if(cur<steps.length-1){cur++;show();}else{closeTutorial();G.tutorialShown=1;save();}};window.closeTutorial=function(){let el=document.getElementById('tutorialOverlay');if(el)el.remove();G.tutorialShown=1;save();};show();}

function loop(){if(G.paused)return;updateUI();bankInterest();let max=Math.min(3+G.rating,10);if(G.mail.filter(o=>!o.completed).length<max){if(!G.nextOrder||Date.now()>G.nextOrder){genOrder();G.nextOrder=Date.now()+getOrderInterval()*1000;}}checkTimeout();processBees();genQuests();renderGarden();updateUI();}

function updateUI(){document.getElementById('coinDisplay').textContent=G.coins;document.getElementById('levelDisplay').textContent='⭐ '+Math.floor(G.stars);document.getElementById('timeDisplay').textContent='🕐 '+timeStr();document.getElementById('rankBadge').textContent=getRankName(G.rank);document.getElementById('rankBadge').className='rank-badge '+G.rank;updateRatingStars();}

function render(){renderGarden();renderMail();renderWorkbench();renderShop();renderAchievements();renderSettings();updateUI();}

// ============================================================
// ЗАПУСК
// ============================================================
if(!load()){initInv();initBeds();G.coins=100;}
if(!G.beds.length)initBeds();
FK.forEach(k=>{if(G.flowers[k]===undefined)G.flowers[k]=0;});
SEEDLING_KEYS.forEach(s=>FK.forEach(k=>{let sk=getSeedlingKey(k,s);if(G.seedlings[sk]===undefined)G.seedlings[sk]=0;}));
WRAP_KEYS.forEach(k=>{if(G.wraps[k]===undefined)G.wraps[k]=0;});
if(!G.quests.daily.length)genQuests();
initStock();updateUnlocked();

document.querySelectorAll('.tab').forEach(t=>{t.addEventListener('click',function(){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));document.querySelectorAll('.tab-content').forEach(x=>x.classList.remove('active'));this.classList.add('active');let n=this.dataset.tab;document.getElementById('tab-'+n).classList.add('active');if(n==='settings')renderSettings();else if(n==='achievements')renderAchievements();else render();document.getElementById('mainContent').scrollTop=0;});});
document.getElementById('closeMatch3Btn').addEventListener('click',closeM3);document.getElementById('closeMatch3BtnBottom').addEventListener('click',closeM3);document.getElementById('match3Overlay').addEventListener('click',function(e){if(e.target===this)closeM3();});

render();checkTut();loopInterval=setInterval(loop,1000);setInterval(save,3000);setInterval(()=>{updateUI();document.getElementById('timeDisplay').textContent='🕐 '+timeStr();},60000);
</script>
</body>
</html>
